<style>
  :root { --paper: #F3ECDF; --cloud: #FFFDF8; --ink: #23203A; --pink: #FF5E8E; --blue: #3358E0; --sun: #FFC63D;
    /* One unit of the 1200×1200 scene, as the cover-scaled image draws it. */
    --u: calc(max(100vw, 100dvh) / 1200) }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden }
  img { display: block; width: 100vw; height: 100dvh; object-fit: cover }
  /* The buttons sit in the scene's own coordinates, under the circled install command. */
  nav { position: fixed; left: 50%; top: calc(50dvh + 222 * var(--u)); translate: -50% 0; display: flex; gap: calc(20 * var(--u)) }
  nav a {
    display: inline-flex; align-items: center; gap: calc(9 * var(--u)); height: calc(52 * var(--u)); padding: 0 calc(18 * var(--u));
    font: 600 calc(16 * var(--u)) / 1 "JetBrains Mono", ui-monospace, Menlo, monospace; color: var(--ink); text-decoration: none; white-space: nowrap;
    background: var(--cloud); border: calc(3 * var(--u)) solid var(--ink); border-radius: calc(26 * var(--u));
    box-shadow: calc(5 * var(--u)) calc(5 * var(--u)) 0 var(--shadow);
    rotate: var(--tilt); transition: translate .18s cubic-bezier(.3, 1.6, .5, 1), rotate .18s cubic-bezier(.3, 1.6, .5, 1), box-shadow .18s;
    animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) backwards;
  }
  nav a:nth-child(1) { --shadow: var(--pink); --tilt: -2deg; animation-delay: 5s }
  nav a:nth-child(2) { --shadow: var(--blue); --tilt: 2deg; animation-delay: 5.15s }
  nav a:nth-child(3) { --shadow: var(--sun); --tilt: -1deg; animation-delay: 5.3s }
  nav a:hover { rotate: calc(var(--tilt) * -1.5); translate: 0 calc(-4 * var(--u)); box-shadow: calc(9 * var(--u)) calc(10 * var(--u)) 0 var(--shadow) }
  nav a:active { translate: calc(6 * var(--u)) calc(6 * var(--u)); box-shadow: 0 0 0 var(--shadow); transition-duration: .05s }
  nav a:focus-visible { outline: calc(3 * var(--u)) dashed var(--ink); outline-offset: calc(6 * var(--u)) }
  nav svg { width: calc(18 * var(--u)); height: calc(18 * var(--u)); flex: none }
  @keyframes pop { from { opacity: 0; transform: translateY(calc(24 * var(--u))) scale(.5) rotate(-8deg) } }
  @media (prefers-reduced-motion: reduce) { nav a { animation: none; transition: none } }
