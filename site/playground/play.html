<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · svjeez</title>
<meta name="description" content="Edit a svjeez scene and watch the SVG recompile in your browser.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/site.css">
<style>
h1 { margin: 1rem 0 0.5rem; font-size: clamp(1.5rem, 1.1rem + 1.5vw, 2rem) }
.lede { margin: 0 0 1rem; max-inline-size: 60ch; color: var(--muted) }
main { padding-block-end: 3rem }
.wrap.wide { inline-size: min(100% - 2 * var(--gutter), 90rem) }
@media (max-width: 30rem) { .top nav .opt { display: none } }
</style>
</head>
<body>
<header class="wrap wide top">
  <a class="brand" href="/"><img src="/favicon.svg" width="26" height="26" alt="">svjeez</a>
  <nav aria-label="Main">
    <a href="/examples/">Examples</a>
    <a href="/play" aria-current="page" style="color:var(--ink)">Playground</a>
    <a class="opt" href="/intro">Intro</a>
    <a class="opt" href="https://github.com/saiashirwad/svjeez">GitHub</a>
    <button class="theme" type="button" aria-label="Switch between light and dark">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </nav>
</header>
<main class="wrap wide">
  <h1>Playground</h1>
  <p class="lede">Edit the TSX. The SVG compiles in your browser, in a worker, with the same library you install from npm.</p>
  <div data-playground="toast" data-eager></div>
</main>
<script type="module" src="/playground/embed.js"></script>
<script src="/site.js" defer></script>
</body>
</html>
