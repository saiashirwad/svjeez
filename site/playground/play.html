<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground · svjeez</title>
<meta name="description" content="Edit a svjeez scene and watch the SVG recompile in your browser.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root {
  --bg: light-dark(oklch(97% 0.018 85), oklch(19% 0.035 275));
  --ink: light-dark(oklch(24% 0.025 70), oklch(94% 0.012 275));
  --muted: light-dark(oklch(48% 0.025 70), oklch(74% 0.02 275));
  --line: light-dark(oklch(88% 0.02 80), oklch(31% 0.035 275));
  --accent: light-dark(oklch(60% 0.19 40), oklch(76% 0.16 40));
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
}
:root[data-theme="light"] { color-scheme: light }
:root[data-theme="dark"] { color-scheme: dark }
* { box-sizing: border-box }
html { background: var(--bg); text-size-adjust: none; -webkit-text-size-adjust: none }
body { margin: 0; min-block-size: 100dvh; color: var(--ink); background: var(--bg); font: 400 1rem / 1.6 var(--sans); text-wrap: pretty }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px }
.wrap { inline-size: min(100% - 2rem, 76rem); margin-inline: auto }
header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.25rem }
.brand { color: var(--ink); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; text-decoration: none }
.brand i { color: var(--accent); font-style: normal }
nav { display: flex; align-items: center; gap: 0.25rem }
nav a { padding: 0.5rem 0.75rem; color: var(--muted); text-decoration: none; border-radius: 0.5rem; transition: color 120ms ease-out }
nav a[aria-current] { color: var(--ink) }
@media (hover: hover) and (pointer: fine) { nav a:hover { color: var(--ink) } }
h1 { margin: 1.5rem 0 0.25rem; font-size: clamp(1.75rem, 1.2rem + 2vw, 2.5rem); line-height: 1.15; letter-spacing: -0.02em }
.lede { margin: 0 0 1.5rem; max-inline-size: 60ch; color: var(--muted) }
main { padding-block-end: 4rem }
</style>
</head>
<body>
<header class="wrap">
  <a class="brand" href="/">svjeez<i>.</i></a>
  <nav aria-label="Main">
    <a href="/examples/">Examples</a>
    <a href="/play" aria-current="page">Playground</a>
    <a href="https://github.com/saiashirwad/svjeez">GitHub</a>
  </nav>
</header>
<main class="wrap">
  <h1>Playground</h1>
  <p class="lede">Edit the TSX. The SVG compiles in your browser, in a worker, with the same library you install from npm.</p>
  <div data-playground="toast" data-eager></div>
</main>
<script type="module" src="/playground/embed.js"></script>
</body>
</html>
