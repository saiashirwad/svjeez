name: release

# Every push to main runs CI and the plan; pull requests (next included) get CI from ci.yml. Publishing is gated: it runs only on a manual workflow_dispatch of this workflow.
# A dispatch releases each package under packages/ whose version isn't on npm and GitHub yet.
# On next, scripts/release.ts releases only prerelease versions, which go to npm's next dist-tag.
# scripts/release.ts decides which ones. npm's trusted publisher for every package names this file and the npm environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts plan

  publish:
    needs: [ci, plan]
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      # The release notes come from git log since the package's previous tag, so the job needs the history and tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # npm 11.5.1+ for trusted publishing, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts publish

  # The single-file svjeez for every platform, attached to the svjeez release (v<version>) it was built beside, which
  # packages/bin/install.sh downloads from. It builds on a Mac because a Mac binary has to be signed again on one; the
  # other platforms cross-compile. They go up as one set with their checksums; a release that has them keeps them, so a
  # later dispatch doesn't change what a version installs.
  binaries:
    needs: [ci, publish]
    if: github.event_name == 'workflow_dispatch' && !failure() && !cancelled()
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts --all
        working-directory: packages/bin
      - name: Attach them to the svjeez release
        working-directory: packages/bin/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version ../../svjeez/package.json)"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::svjeez has no $tag release yet, so the binaries wait for it."
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx svjeez-checksums.txt; then
            echo "$tag already has its binaries."
            exit 0
          fi
          gh release upload "$tag" svjeez-*
