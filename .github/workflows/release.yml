name: release

# Every push to main runs CI, then releases each package under packages/ whose version isn't on npm and GitHub yet.
# scripts/release.ts decides which ones. npm's trusted publisher for every package names this file and the npm environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts plan

  publish:
    needs: [ci, plan]
    if: needs.plan.outputs.packages != ''
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      # The release notes come from git log since the package's previous tag, so the job needs the history and tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # npm 11.5.1+ for trusted publishing, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts publish
