name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts plan

  publish:
    needs: [ci, plan]
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts publish

  binaries:
    needs: [ci, publish]
    if: github.event_name == 'workflow_dispatch' && !failure() && !cancelled()
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/build.ts --all
        working-directory: packages/bin
      - name: Attach them to the svjeez release
        working-directory: packages/bin/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version ../../svjeez/package.json)"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::svjeez has no $tag release yet, so the binaries wait for it."
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx svjeez-checksums.txt; then
            echo "$tag already has its binaries."
            exit 0
          fi
          gh release upload "$tag" svjeez-*
