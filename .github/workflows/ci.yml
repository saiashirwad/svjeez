name: ci

# release.yml runs this on every push to main, before it releases.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      # Browser builds are pinned by the lockfile, so cache them across runs. --with-deps still installs the system packages.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The locked playwright-core, since bunx fetches the latest and its Chromium build isn't the one the tests launch.
      - run: bun run playwright-core install --with-deps chromium-headless-shell
        working-directory: packages/svjeez
      - run: bun run typecheck
      - run: bun run test
      - run: npm pack --dry-run
        working-directory: packages/svjeez

  # dist/ is built on macOS. Linux libm differs in the last bit of Math.sin and friends, which changes some printed floats.
  dist:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: examples
      - name: dist/ matches the examples
        working-directory: examples
        run: |
          git add --intent-to-add dist
          git diff --exit-code --stat dist || { git diff --word-diff=plain --unified=0 dist | head -60; echo "::error::dist/ is stale. Run 'bun run build' and commit the result."; exit 1; }

  # Every example must play and seek the same in Chromium, Firefox and WebKit. dist/ is committed, so nothing is built.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Browser builds are pinned by the lockfile, so cache them across runs. --with-deps still installs the system packages.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The locked playwright-core, since bunx fetches the latest and its browser builds aren't the ones the tests launch.
      - run: bun run playwright-core install --with-deps chromium-headless-shell firefox webkit
        working-directory: packages/svjeez
      - run: bun run test:browsers
        working-directory: examples

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: node --version
      # Browser builds are pinned by the lockfile, so cache them across runs. --with-deps still installs the system packages.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The locked playwright-core, since bunx fetches the latest and its Chromium build isn't the one the tests launch.
      - run: bun run playwright-core install --with-deps chromium-headless-shell
        working-directory: packages/svjeez
      - run: npm run test:node
        working-directory: packages/svjeez
      - run: npm run test:node
        working-directory: examples
      - run: npm run test:package
        working-directory: packages/svjeez
      # The add-on package checks don't depend on the Node version, so they run once, on 22. Node 20 keeps the core package's
      # check, which runs the packed CLI and imports every entry point. Astro 7 needs Node 22 anyway.
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/fonts
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/icons
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/charts
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/code
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/geo
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/math
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/diagrams
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/mermaid
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/vite
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/video
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/astro
