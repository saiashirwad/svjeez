name: ci

# release.yml runs this on every push to main, before it releases.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that launch a browser run in Playwright's image, which ships the browsers and their system packages. On a bare runner
# those are an apt install from a mirror that is sometimes slow enough to stall a job for minutes.
# The image version must match the playwright-core in bun.lock, since each release pins its own browser builds.
# In it, setup-bun can't run (it needs unzip), so bun comes from npm, and HOME is /root because Firefox won't run as root with
# a HOME owned by another user, which is how Actions starts the container.

jobs:
  # Pull requests that touch only these paths skip every job but check. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!AGENTS.md"
              - "!UPGRADING.md"
              - "!.vscode/**"
              - "!site/**"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

  # Not in Playwright's image: @svjeez/dom's tests measure text in the runner's system fonts, which the image doesn't have.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The locked playwright-core, since bunx fetches the latest and its Chromium build isn't the one the tests launch.
      - run: bun run playwright-core install --with-deps chromium-headless-shell
        working-directory: packages/svjeez
      - run: bun run test
      - run: npm pack --dry-run
        working-directory: packages/svjeez

  # dist/ is built on macOS. Linux libm differs in the last bit of Math.sin and friends, which changes some printed floats.
  dist:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: examples
      - name: dist/ matches the examples
        working-directory: examples
        run: |
          git add --intent-to-add dist
          git diff --exit-code --stat dist || { git diff --word-diff=plain --unified=0 dist | head -60; echo "::error::dist/ is stale. Run 'bun run build' and commit the result."; exit 1; }

  # Every example must play and seek the same in Chromium, Firefox and WebKit. dist/ is committed, so nothing is built.
  browsers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global bun
      - run: bun install --frozen-lockfile
      - run: bun run test:browsers
        working-directory: examples

  # The core package on Node: its tests, the examples, and the packed CLI and entry points.
  node:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global bun
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm run test:node
        working-directory: packages/svjeez
      - run: npm run test:node
        working-directory: examples
      - run: npm run test:package
        working-directory: packages/svjeez

  # The add-on packages' packed checks, split in two so they finish alongside the other jobs.
  packages:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    strategy:
      matrix:
        packages:
          - fonts icons charts code geo math og
          - diagrams mermaid vite video astro live bin
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global bun
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: npm run test:package in ${{ matrix.packages }}
        run: for p in ${{ matrix.packages }}; do (cd "packages/$p" && npm run test:package) || exit 1; done
