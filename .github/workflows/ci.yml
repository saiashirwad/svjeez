name: ci

# release.yml runs this on every push to main, before it releases.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium-headless-shell
      - run: bun run typecheck
      - run: bun run test
      - run: npm pack --dry-run
        working-directory: packages/svjeez

  # dist/ is built on macOS. Linux libm differs in the last bit of Math.sin and friends, which changes some printed floats.
  dist:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: examples
      - name: dist/ matches the examples
        working-directory: examples
        run: |
          git add --intent-to-add dist
          git diff --exit-code --stat dist || { git diff --word-diff=plain --unified=0 dist | head -60; echo "::error::dist/ is stale. Run 'bun run build' and commit the result."; exit 1; }

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: node --version
      - run: npm run test:node
        working-directory: packages/svjeez
      - run: npm run test:node
        working-directory: examples
      - run: npm run test:package
        working-directory: packages/svjeez
      - run: npm run test:package
        working-directory: packages/code
      - run: npm run test:package
        working-directory: packages/fonts
      - run: npm run test:package
        working-directory: packages/geo
      - run: npm run test:package
        working-directory: packages/math
      - run: npm run test:package
        working-directory: packages/charts
      - run: npm run test:package
        working-directory: packages/mermaid
      - run: npm run test:package
        working-directory: packages/live
      - run: npm run test:package
        working-directory: packages/svelte
      - run: npm run test:package
        working-directory: packages/react
      - run: bunx playwright-core install --with-deps chromium-headless-shell
      - run: npm run test:package
        working-directory: packages/vite
      - run: npm run test:package
        working-directory: packages/video
      # Astro 7 needs Node 22.
      - run: npm run test:package
        if: matrix.node != 20
        working-directory: packages/astro
