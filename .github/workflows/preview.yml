name: preview

# Every push and same-repo pull request publishes every package to pkg.pr.new, which needs its GitHub App on the repo.
# Install a commit with `bun add https://pkg.pr.new/svjeez@<sha>`, or the latest on a branch with `...svjeez@main`.
# Pull requests from forks don't publish, so nobody else's code gets an install URL under this repo.
on:
  push:
    branches: ["**"]
    tags: ["!**"]
  pull_request:

permissions: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts preview
