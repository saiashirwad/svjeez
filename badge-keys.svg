<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 136" width="440" height="136" role="img" aria-labelledby="title">
  <title id="title">After a reorder, Alice and Bob each keep their component key</title>
  <rect width="440" height="136" rx="10" fill="#f6f8fa"/>
  <g font-family="system-ui,sans-serif" font-size="15" fill="#24292f">
    <text x="16" y="29" font-weight="600">Scene order</text>
    <text x="16" y="66">Before swap</text><text x="16" y="111">After swap</text>
  </g>
  <g fill="#dbeafe"><rect x="140" y="43" width="132" height="33" rx="7"/><rect x="288" y="88" width="132" height="33" rx="7"/></g>
  <g fill="#ffedd5"><rect x="288" y="43" width="132" height="33" rx="7"/><rect x="140" y="88" width="132" height="33" rx="7"/></g>
  <g font-family="monospace" font-size="15" text-anchor="middle" fill="#24292f">
    <text x="206" y="65">key="alice"</text><text x="354" y="65">key="bob"</text>
    <text x="206" y="110">key="bob"</text><text x="354" y="110">key="alice"</text>
  </g>
</svg>
