<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t d" font-family="'Geist'" font-weight="400">
  <title id="t">Clocks</title>
  <desc id="d">A settings card in three parts: a panel that slides open and a bar chart that grows, each on a clock that page code can play, reverse or scrub, and a status dot that pulses on the scene's own clock.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:4s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes k1{0%,25%{fill:var(--raised)}37.5%,100%{fill:var(--green)}}
.m1{animation-name:k1}
@keyframes k2{0%,25%{translate:157px 7px}37.5%,100%{translate:175px 7px}}
.m2{animation-name:k2;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes k3{0%,25%{opacity:0;translate:-12px 0}31.25%,100%{opacity:1;translate:0 0}}
.m3{animation-name:k3}
@keyframes k4{0%,27%{opacity:0;translate:-12px 38px}33.25%,100%{opacity:1;translate:0 38px}}
.m4{animation-name:k4}
@keyframes k5{0%,29%{opacity:0;translate:-12px 76px}35.25%,100%{opacity:1;translate:0 76px}}
.m5{animation-name:k5}
@keyframes k6{0%,50%{scale:1 0}65%,100%{scale:1 1}}
.m6{animation-name:k6}
@keyframes k7{0%,53.75%{scale:1 0}68.75%,100%{scale:1 1}}
.m7{animation-name:k7}
@keyframes k8{0%,57.5%{scale:1 0}72.5%,100%{scale:1 1}}
.m8{animation-name:k8}
@keyframes k9{0%,61.25%{scale:1 0}76.25%,100%{scale:1 1}}
.m9{animation-name:k9}
@keyframes k10{0%,65%{scale:1 0}80%,100%{scale:1 1}}
.m10{animation-name:k10}
@keyframes k11{0%,100%{scale:1;opacity:1}50%{scale:1.5;opacity:0.5}}
.m11{animation-name:k11;animation-duration:1.333s;animation-iteration-count:3;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-3.4s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="480" height="300" fill="var(--background)"/>
  <rect x="20.75" y="20.75" width="440" height="260" rx="18" fill="var(--surface)" stroke="var(--raised)" stroke-width="1.5"/>
  <g transform="translate(44 44)">
    <text y="16.08" font-weight="600" font-size="16" fill="var(--text)">Settings</text>
    <rect x="148" y="-4" width="40" height="22" rx="11" fill="var(--raised)" data-clock="open" data-clock-at="1" data-clock-over="0.5" class="a m1"/>
    <circle r="8" fill="var(--background)" data-clock="open" data-clock-at="1" data-clock-over="0.5" class="a m2"/>
    <g transform="translate(0 30)" data-clock="open" data-clock-at="1" data-clock-over="0.5">
      <g class="a m3">
        <rect width="188" height="30" rx="8" fill="var(--raised)"/>
        <text x="14" y="19" font-size="13" fill="var(--text)">Notifications</text>
      </g>
      <g class="a m4">
        <rect width="188" height="30" rx="8" fill="var(--raised)"/>
        <text x="14" y="19" font-size="13" fill="var(--text)">Dark mode</text>
      </g>
      <g class="a m5">
        <rect width="188" height="30" rx="8" fill="var(--raised)"/>
        <text x="14" y="19" font-size="13" fill="var(--text)">Autosave</text>
      </g>
    </g>
  </g>
  <g transform="translate(268 44)">
    <text y="16.08" font-weight="600" font-size="16" fill="var(--text)">Usage</text>
    <g transform="translate(0 40)" fill="var(--blue)">
      <rect y="120" width="176" height="1.5" fill="var(--border)"/>
      <rect y="86" width="24" height="34" rx="5" data-clock="grow" data-clock-at="2" data-clock-over="1.2" class="a m6 fb"/>
      <rect x="36" y="62" width="24" height="58" rx="5" data-clock="grow" data-clock-at="2" data-clock-over="1.2" class="a m7 fb"/>
      <rect x="72" y="74" width="24" height="46" rx="5" data-clock="grow" data-clock-at="2" data-clock-over="1.2" class="a m8 fb"/>
      <rect x="108" y="42" width="24" height="78" rx="5" data-clock="grow" data-clock-at="2" data-clock-over="1.2" class="a m9 fb"/>
      <rect x="144" y="58" width="24" height="62" rx="5" data-clock="grow" data-clock-at="2" data-clock-over="1.2" class="a m10 fb"/>
    </g>
  </g>
  <g transform="translate(44 250)">
    <circle cx="5" cy="5" r="5" fill="var(--green)" class="a m11 fb"/>
    <text x="18" y="9" font-family="'JetBrains Mono'" font-size="11" fill="var(--muted)">synced</text>
  </g>
</svg>
