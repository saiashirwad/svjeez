<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="stepper-t stepper-d" data-states="{&quot;plan&quot;:{&quot;step&quot;:0},&quot;build&quot;:{&quot;step&quot;:0.3333333333333333},&quot;test&quot;:{&quot;step&quot;:0.6666666666666666},&quot;ship&quot;:{&quot;step&quot;:1}}" font-family="'stepper-Geist'" class="stepper-root">
  <title id="stepper-t">Stepper</title>
  <desc id="stepper-d">A four-step progress on one clock with four stops: an icon morphs from step to step, a bar fills and the label changes. Page code rests the clock at a stop and moves it with Back and Next, which stop at the ends.</desc>
  <style><![CDATA[
svg.stepper-root{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg.stepper-root{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'stepper-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:600;font-style:normal}
.stepper-a{animation-duration:3s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes stepper-k1{0%,20%{scale:0 1}36.667%{scale:0.333 1}53.333%{scale:0.667 1}70%,100%{scale:1 1}}
.stepper-m1{animation-name:stepper-k1;animation-timing-function:linear}
@keyframes stepper-k2{0%,30%{fill:var(--raised)}36.667%,100%{fill:var(--blue)}}
.stepper-m2{animation-name:stepper-k2}
@keyframes stepper-k3{0%,46.667%{fill:var(--raised)}53.333%,100%{fill:var(--blue)}}
.stepper-m3{animation-name:stepper-k3}
@keyframes stepper-k4{0%,63.333%{fill:var(--raised)}70%,100%{fill:var(--blue)}}
.stepper-m4{animation-name:stepper-k4}
@keyframes stepper-k5{0%,20%{fill:var(--blue)}36.667%{fill:var(--orange)}53.333%{fill:var(--cyan)}70%,100%{fill:var(--green)}}
.stepper-m5{animation-name:stepper-k5}
@keyframes stepper-k6{0%,20%{opacity:1}26.667%,100%{opacity:0}}
.stepper-m6{animation-name:stepper-k6}
@keyframes stepper-k7{0%,30%,43.333%,100%{opacity:0}36.667%{opacity:1}}
.stepper-m7{animation-name:stepper-k7}
@keyframes stepper-k8{0%,46.667%,60%,100%{opacity:0}53.333%{opacity:1}}
.stepper-m8{animation-name:stepper-k8}
@keyframes stepper-k9{0%,63.333%{opacity:0}70%,100%{opacity:1}}
.stepper-m9{animation-name:stepper-k9}
@keyframes stepper-k10{0%,20%{opacity:0.4}26.667%,100%{opacity:1}}
.stepper-m10{animation-name:stepper-k10}
@keyframes stepper-k11{0%,63.333%{opacity:1}70%,100%{opacity:0.4}}
.stepper-m11{animation-name:stepper-k11}
@media (prefers-reduced-motion:reduce){.stepper-a{animation-delay:-2.55s!important;animation-play-state:paused!important}.stepper-dm{display:none}.stepper-ds{display:inline}}
]]></style>
