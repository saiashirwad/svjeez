  <text x="209.868" y="188" font-weight="600" font-size="17" fill="var(--text)" data-clock="step" data-clock-at="0.6" data-clock-over="1.5" class="stepper-a stepper-m7">2. Build</text>
  <text x="213.353" y="188" font-weight="600" font-size="17" fill="var(--text)" data-clock="step" data-clock-at="0.6" data-clock-over="1.5" class="stepper-a stepper-m8">3. Test</text>
  <text x="212.188" y="188" font-weight="600" font-size="17" fill="var(--text)" data-clock="step" data-clock-at="0.6" data-clock-over="1.5" class="stepper-a stepper-m9">4. Ship</text>
