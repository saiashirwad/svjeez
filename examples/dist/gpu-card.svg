<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 562 418" width="562" height="418" role="img" aria-labelledby="gpu-card-t gpu-card-d" data-states="{&quot;calm&quot;:{&quot;storm&quot;:0},&quot;storm&quot;:{&quot;storm&quot;:1}}" font-family="'gpu-card-JetBrains Mono'" class="gpu-card-root">
  <title id="gpu-card-t">Signal</title>
  <desc id="gpu-card-d">A signal card. Its title, a calm or storm badge, a scale and three readouts are vectors; the field in the middle is a slot that a page fills with a live WebGPU shader, and shows a still gradient aurora without one. Here the card goes from calm to storm: the badge turns orange, the readouts climb and the aurora turns from cyan and blue to magenta and orange.</desc>
  <style><![CDATA[
svg.gpu-card-root{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF;--cyan-62-text:color-mix(in srgb,var(--cyan) 62%,var(--text));--orange-62-text:color-mix(in srgb,var(--orange) 62%,var(--text));--blue-10-background:color-mix(in srgb,var(--blue) 10%,var(--background));--blue-10-background-55-blue-10-background:color-mix(in srgb,var(--blue-10-background) 55%,var(--blue-10-background));--cyan-55-blue-10-background:color-mix(in srgb,var(--cyan) 55%,var(--blue-10-background));--blue-55-blue-10-background:color-mix(in srgb,var(--blue) 55%,var(--blue-10-background));--magenta-55-blue-10-background:color-mix(in srgb,var(--magenta) 55%,var(--blue-10-background));--orange-55-blue-10-background:color-mix(in srgb,var(--orange) 55%,var(--blue-10-background));--orange-35-text:color-mix(in srgb,var(--orange) 35%,var(--text));--cyan-14-surface:color-mix(in srgb,var(--cyan) 14%,var(--surface));--orange-14-surface:color-mix(in srgb,var(--orange) 14%,var(--surface));--background-20-blue-10-background:color-mix(in srgb,var(--background) 20%,var(--blue-10-background))}
@media (prefers-color-scheme:light){svg.gpu-card-root{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'gpu-card-JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
@font-face{font-family:'gpu-card-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:600;font-style:normal}
.gpu-card-a{animation-duration:4s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes gpu-card-k1{0%,35%{opacity:1}50%,100%{opacity:0}}
.gpu-card-m1{animation-name:gpu-card-k1;animation-timing-function:linear}
@keyframes gpu-card-k2{0%,50%{opacity:0}65%,100%{opacity:1}}
.gpu-card-m2{animation-name:gpu-card-k2;animation-timing-function:linear}
@keyframes gpu-card-k3{0%,35%{opacity:0}65%,100%{opacity:1}}
.gpu-card-m3{animation-name:gpu-card-k3;animation-timing-function:linear}
@media (prefers-reduced-motion:reduce){.gpu-card-a{animation-delay:-3.6s!important;animation-play-state:paused!important}}
]]></style>
