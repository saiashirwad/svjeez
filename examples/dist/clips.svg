<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="'JetBrains Mono'">
  <title id="t">A clip</title>
  <desc id="d">Two desktops play one gesture a few seconds apart: a cursor takes a window by its title bar and drags it while a key is held, then the window goes back.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:9s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,19.444%,33.889%,100%{opacity:0}20.333%,33%{opacity:1}}
.m1{animation-name:k1}
@keyframes k2{0%,100%{translate:28px 36px}21.111%{translate:28px 36px;animation-timing-function:cubic-bezier(.77,0,.175,1)}32.222%,91.111%{translate:150px 110px}}
.m2{animation-name:k2}
@keyframes k3{0%,11.111%,40.556%,100%{translate:244.6px 196.6px}18.889%,21.111%{translate:80.6px 46.1px}32.222%,35%{translate:202.6px 120.1px}}
.m3{animation-name:k3;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes k4{0%,57.222%,71.667%,100%{opacity:0}58.111%,70.778%{opacity:1}}
.m4{animation-name:k4}
@keyframes k5{0%,100%{translate:28px 96px}58.889%{translate:28px 96px;animation-timing-function:cubic-bezier(.77,0,.175,1)}70%,91.111%{translate:150px 36px}}
.m5{animation-name:k5}
@keyframes k6{0%,48.889%,78.333%,100%{translate:244.6px 196.6px}56.667%,58.889%{translate:80.6px 106.1px}70%,72.778%{translate:202.6px 46.1px}}
.m6{animation-name:k6;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-2s!important;animation-play-state:paused!important}}
]]></style>
  <defs>
    <g id="u1" fill="var(--border)">
      <rect x="0.75" y="0.75" width="102.5" height="70.5" rx="7" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
      <path d="M6.25 0H94.75A6.25 6.25 0 0 1 101 6.25V16H0V6.25A6.25 6.25 0 0 1 6.25 0Z" transform="translate(1.5 1.5)" fill="var(--raised)"/>
      <circle cx="13.5" cy="9.5" r="3" fill="var(--red)"/>
      <circle cx="24.5" cy="9.5" r="3" fill="var(--yellow)"/>
      <circle cx="35.5" cy="9.5" r="3" fill="var(--green)"/>
      <rect x="14.5" y="28.5" width="60" height="5" rx="2.5"/>
      <rect x="14.5" y="40.5" width="44" height="5" rx="2.5"/>
    </g>
  </defs>
  <rect width="640" height="300" fill="var(--background)"/>
  <g transform="translate(20 30)">
    <rect width="290" height="240" rx="14" fill="var(--background)" stroke="var(--raised)" stroke-width="1.5"/>
    <g transform="translate(16 184)">
      <rect width="48" height="40" rx="9" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
      <rect width="48" height="40" rx="9" fill="var(--raised)" stroke="var(--blue)" stroke-width="2" class="a m1"/>
      <text x="11.4" y="25" font-size="14" fill="var(--text)">opt</text>
    </g>
    <use class="a m2" href="#u1"/>
    <path d="M0 0L0 16L4.2 12.2L7.2 19L10 17.8L7 11.2L12 11.2Z" fill="var(--text)" stroke="var(--background)" stroke-width="1.2" stroke-linejoin="round" class="a m3"/>
  </g>
  <g transform="translate(330 30)">
    <rect width="290" height="240" rx="14" fill="var(--background)" stroke="var(--raised)" stroke-width="1.5"/>
    <g transform="translate(16 184)">
      <rect width="48" height="40" rx="9" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
      <rect width="48" height="40" rx="9" fill="var(--raised)" stroke="var(--blue)" stroke-width="2" class="a m4"/>
      <text x="11.4" y="25" font-size="14" fill="var(--text)">opt</text>
    </g>
    <use class="a m5" href="#u1"/>
    <path d="M0 0L0 16L4.2 12.2L7.2 19L10 17.8L7 11.2L12 11.2Z" fill="var(--text)" stroke="var(--background)" stroke-width="1.2" stroke-linejoin="round" class="a m6"/>
  </g>
</svg>
