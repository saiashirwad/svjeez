<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 278" width="980" height="278" role="img" aria-labelledby="t d" font-family="'JetBrains Mono'">
  <title id="t">Kanban board</title>
  <desc id="d">A Mermaid kanban diagram drawn by @svjeez/mermaid.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF;--muted-14-background:#1E1F22;--muted-55-background:#5D5D61;--orange-55-background:#905C0B}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0;--muted-14-background:#EBEBEB;--muted-55-background:#AFAFB2;--orange-55-background:#F2B381}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,3.75%{translate:0 6px;opacity:0}7.5%,100%{translate:0 0;opacity:1}}
.m1{animation-name:k1}
@keyframes k2{0%,7.5%{translate:0 6px;opacity:0}11.25%,100%{translate:0 0;opacity:1}}
.m2{animation-name:k2}
@keyframes k3{0%,11.25%{translate:0 6px;opacity:0}15%,100%{translate:0 0;opacity:1}}
.m3{animation-name:k3}
@keyframes k4{0%,15%{translate:0 6px;opacity:0}18.75%,100%{translate:0 0;opacity:1}}
.m4{animation-name:k4}
@keyframes k5{0%,18.75%{translate:0 6px;opacity:0}22.5%,100%{translate:0 0;opacity:1}}
.m5{animation-name:k5}
@keyframes k6{0%,22.5%{translate:0 6px;opacity:0}26.25%,100%{translate:0 0;opacity:1}}
.m6{animation-name:k6}
@keyframes k7{0%,26.25%{translate:0 6px;opacity:0}30%,100%{translate:0 0;opacity:1}}
.m7{animation-name:k7}
@keyframes k8{0%,30%{translate:0 6px;opacity:0}33.75%,100%{translate:0 0;opacity:1}}
.m8{animation-name:k8}
@keyframes k9{0%,33.75%{translate:0 6px;opacity:0}37.5%,100%{translate:0 0;opacity:1}}
.m9{animation-name:k9}
@keyframes k10{0%,37.5%{translate:0 6px;opacity:0}41.25%,100%{translate:0 0;opacity:1}}
.m10{animation-name:k10}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-7.5s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="980" height="278" fill="var(--background)"/>
  <g transform="translate(32 32)">
    <g class="a m1">
      <rect width="220" height="214" rx="8" fill="var(--muted-14-background)"/>
      <text x="12" y="22.68" font-size="13" fill="var(--text)">Todo</text>
      <text x="201.37" y="21.978" font-size="11.05" fill="var(--muted)">2</text>
    </g>
    <g transform="translate(8 36)" class="a m2" font-size="13" fill="var(--text)">
      <rect width="204" height="81" rx="6" fill="var(--background)" stroke="var(--border)"/>
      <rect x="2" y="6" width="3" height="69" rx="1.5" fill="var(--muted-55-background)"/>
      <text x="10" y="24.68">Write the launch blog</text>
      <text x="10" y="44.68">post</text>
      <text x="174.11" y="66.478" font-size="11.05" fill="var(--muted)">mia</text>
    </g>
    <g transform="translate(8 125)" class="a m3" font-size="13" fill="var(--text)">
      <rect width="204" height="81" rx="6" fill="var(--background)" stroke="var(--border)"/>
      <rect x="2" y="6" width="3" height="69" rx="1.5" fill="var(--orange)"/>
      <text x="10" y="24.68">Checkout fails on</text>
      <text x="10" y="44.68">expired cards</text>
      <text x="10" y="66.478" font-size="11.05" fill="var(--muted)">SHOP-214</text>
      <text x="174.11" y="66.478" font-size="11.05" fill="var(--muted)">raj</text>
    </g>
    <g transform="translate(232 0)">
      <g class="a m4">
        <rect width="220" height="214" rx="8" fill="var(--muted-14-background)"/>
        <text x="12" y="22.68" font-size="13" fill="var(--text)">In progress</text>
        <text x="201.37" y="21.978" font-size="11.05" fill="var(--muted)">1</text>
      </g>
      <g transform="translate(8 36)" class="a m5" font-size="13" fill="var(--text)">
        <rect width="204" height="101" rx="6" fill="var(--background)" stroke="var(--border)"/>
        <rect x="2" y="6" width="3" height="89" rx="1.5" fill="var(--orange-55-background)"/>
        <text x="10" y="24.68">Rework the orders API</text>
        <text x="10" y="44.68">so it pages results and</text>
        <text x="10" y="64.68">returns stable cursors</text>
        <text x="10" y="86.478" font-size="11.05" fill="var(--muted)">SHOP-198</text>
        <text x="167.48" y="86.478" font-size="11.05" fill="var(--muted)">lena</text>
      </g>
    </g>
    <g transform="translate(464 0)">
      <g class="a m6">
        <rect width="220" height="214" rx="8" fill="var(--muted-14-background)"/>
        <text x="12" y="22.68" font-size="13" fill="var(--text)">In review</text>
        <text x="201.37" y="21.978" font-size="11.05" fill="var(--muted)">1</text>
      </g>
      <g transform="translate(8 36)" class="a m7" font-size="11.05" fill="var(--muted)">
        <rect width="204" height="61" rx="6" fill="var(--background)" stroke="var(--border)"/>
        <text x="10" y="24.68" font-size="13" fill="var(--text)">Faceted search</text>
        <text x="10" y="46.478">SHOP-176</text>
        <text x="167.48" y="46.478">omar</text>
      </g>
    </g>
    <g transform="translate(696 0)">
      <g class="a m8">
        <rect width="220" height="214" rx="8" fill="var(--muted-14-background)"/>
        <text x="12" y="22.68" font-size="13" fill="var(--text)">Done</text>
        <text x="201.37" y="21.978" font-size="11.05" fill="var(--muted)">2</text>
      </g>
      <g transform="translate(8 36)" class="a m9">
        <rect width="204" height="61" rx="6" fill="var(--background)" stroke="var(--border)"/>
        <text x="10" y="24.68" font-size="13" fill="var(--text)">Cart summary</text>
        <text x="10" y="46.478" font-size="11.05" fill="var(--muted)">SHOP-150</text>
      </g>
      <g transform="translate(8 105)" class="a m10" fill="var(--muted)">
        <rect width="204" height="61" rx="6" fill="var(--background)" stroke="var(--border)"/>
        <rect x="2" y="6" width="3" height="49" rx="1.5"/>
        <text x="10" y="24.68" font-size="13" fill="var(--text)">Single sign-on</text>
        <text x="10" y="46.478" font-size="11.05">SHOP-131</text>
      </g>
    </g>
  </g>
</svg>
