<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1132 322" width="1132" height="322" role="img" aria-labelledby="t d" font-family="'JetBrains Mono'">
  <title id="t">Timeline</title>
  <desc id="d">A Mermaid timeline diagram drawn by @svjeez/mermaid.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF;--border-12-background:color-mix(in srgb,var(--border) 12%,var(--background));--border-45-background:color-mix(in srgb,var(--border) 45%,var(--background));--magenta-30-background:color-mix(in srgb,var(--magenta) 30%,var(--background));--magenta-10-background:color-mix(in srgb,var(--magenta) 10%,var(--background));--blue-30-background:color-mix(in srgb,var(--blue) 30%,var(--background));--blue-10-background:color-mix(in srgb,var(--blue) 10%,var(--background));--cyan-30-background:color-mix(in srgb,var(--cyan) 30%,var(--background));--cyan-10-background:color-mix(in srgb,var(--cyan) 10%,var(--background))}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,3.75%{opacity:0}7.5%,100%{opacity:1}}
.m1{animation-name:k1}
@keyframes k2{0%,7.5%{opacity:0}11.25%,100%{opacity:1}}
