<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 549 580" width="549" height="580" role="img" aria-labelledby="t d" font-family="'JetBrains Mono'">
  <title id="t">Quadrant chart</title>
  <desc id="d">A Mermaid quadrant diagram drawn by @svjeez/mermaid.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF;--border-10-background:color-mix(in srgb,var(--border) 10%,var(--background));--border-7-background:color-mix(in srgb,var(--border) 7%,var(--background));--border-4-background:color-mix(in srgb,var(--border) 4%,var(--background))}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,3.75%{translate:0 6px;opacity:0}7.5%,100%{translate:0 0;opacity:1}}
.m1{animation-name:k1}
@keyframes k2{0%,7.5%{translate:0 6px;opacity:0}11.25%,100%{translate:0 0;opacity:1}}
.m2{animation-name:k2}
@keyframes k3{0%,11.25%{translate:0 6px;opacity:0}15%,100%{translate:0 0;opacity:1}}
.m3{animation-name:k3}
@keyframes k4{0%,15%{translate:0 6px;opacity:0}18.75%,100%{translate:0 0;opacity:1}}
.m4{animation-name:k4}
@keyframes k5{0%,18.75%{translate:0 6px;opacity:0}22.5%,100%{translate:0 0;opacity:1}}
.m5{animation-name:k5}
@keyframes k6{0%,22.5%{translate:0 6px;opacity:0}26.25%,100%{translate:0 0;opacity:1}}
.m6{animation-name:k6}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-7.5s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="549" height="580" fill="var(--background)"/>
  <g transform="translate(53.112 32.103)">
    <text x="84.1" y="28.32" font-size="16" fill="var(--text)">Reach and engagement of campaigns</text>
    <rect x="255" y="43" width="218" height="218" rx="4" fill="var(--border-10-background)"/>
    <text x="310.96" y="62.271" font-size="11.05" fill="var(--muted)">We should expand</text>
    <rect x="33" y="43" width="218" height="218" rx="4" fill="var(--border-7-background)"/>
    <text x="92.275" y="62.271" font-size="11.05" fill="var(--muted)">Need to promote</text>
    <rect x="33" y="265" width="218" height="218" rx="4" fill="var(--border-4-background)"/>
    <text x="105.535" y="284.271" font-size="11.05" fill="var(--muted)">Re-evaluate</text>
    <rect x="255" y="265" width="218" height="218" rx="4" fill="var(--border-7-background)"/>
    <text x="314.275" y="284.271" font-size="11.05" fill="var(--muted)">May be improved</text>
    <text x="113.165" y="500.478" font-size="11.05" fill="var(--muted)">Low Reach</text>
    <text x="329.85" y="500.478" font-size="11.05" fill="var(--muted)">High Reach</text>
    <text x="-26.91" y="376.978" font-size="11.05" fill="var(--muted)" style="transform-origin:19.5px 373px;rotate:-90deg">Low Engagement</text>
    <text x="-30.225" y="156.978" font-size="11.05" fill="var(--muted)" style="transform-origin:19.5px 153px;rotate:-90deg">High Engagement</text>
    <g class="a m1">
      <circle cx="165" cy="219" r="6" fill="var(--blue)" stroke="var(--background)" stroke-width="1.5"/>
      <text x="131.85" y="240.978" font-size="11.05" fill="var(--text)">Campaign A</text>
    </g>
    <g class="a m2">
      <circle cx="231" cy="381.8" r="6" fill="var(--blue)" stroke="var(--background)" stroke-width="1.5"/>
      <text x="153.7" y="385.778" font-size="11.05" fill="var(--text)">Campaign B</text>
    </g>
    <g class="a m3">
      <circle cx="283.8" cy="179.4" r="9" fill="var(--blue)" stroke="var(--background)" stroke-width="1.5"/>
      <text x="297.8" y="183.378" font-size="11.05" fill="var(--text)">Campaign C</text>
    </g>
    <g class="a m4">
      <circle cx="376.2" cy="333.4" r="6" fill="#FF9F0A" stroke="var(--background)" stroke-width="1.5"/>
      <text x="343.05" y="355.378" font-size="11.05" fill="var(--text)">Campaign D</text>
    </g>
    <g class="a m5">
      <circle cx="209" cy="333.4" r="6" fill="var(--blue)" stroke="var(--background)" stroke-width="1.5"/>
      <text x="175.85" y="355.378" font-size="11.05" fill="var(--text)">Campaign E</text>
    </g>
    <g class="a m6">
      <circle cx="187" cy="139.8" r="6" fill="var(--blue)" stroke="var(--background)" stroke-width="1.5"/>
      <text x="153.85" y="161.778" font-size="11.05" fill="var(--text)">Campaign F</text>
    </g>
  </g>
</svg>
