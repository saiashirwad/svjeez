<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220" role="img" aria-labelledby="t" font-family="'JetBrains Mono'">
  <title id="t">Photo frames</title>
  <style><![CDATA[
svg{--background:#090A0C;--border:#7C7C82;--text:#E5E5EA}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--border:#8E8E93;--text:#1D1D1F}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:3s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,6.667%{opacity:0}23.333%,100%{opacity:1}}
.m1{animation-name:k1}
@keyframes k2{0%,13.333%{opacity:0}30%,100%{opacity:1}}
.m2{animation-name:k2}
@keyframes k3{0%,20%{opacity:0}36.667%,100%{opacity:1}}
.m3{animation-name:k3}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-2.55s!important;animation-play-state:paused!important}}
]]></style>
  <defs>
    <image id="u1" width="480" height="640" preserveAspectRatio="none" href="data:image/png;base64,"/>
    <clipPath id="c1">
      <rect width="110" height="110" rx="16"/>
    </clipPath>
    <clipPath id="c2">
      <rect width="110" height="110"/>
    </clipPath>
    <clipPath id="c3">
      <path d="M55 0H55A55 55 0 0 1 110 55V150H0V55A55 55 0 0 1 55 0Z"/>
    </clipPath>
  </defs>
  <rect width="380" height="220" fill="var(--background)"/>
  <g transform="translate(20 24)" class="a m1">
    <rect width="110" height="110" fill="var(--border)"/>
    <g clip-path="url(#c1)">
      <svg width="110" height="110" viewBox="0 48 480 480" preserveAspectRatio="none">
        <use href="#u1"/>
      </svg>
    </g>
    <text y="173.18" font-size="9" fill="var(--text)">cover, face kept</text>
  </g>
  <g transform="translate(140 24)" class="a m2">
    <rect width="110" height="110" fill="var(--border)"/>
    <g clip-path="url(#c2)">
      <svg width="110" height="110" viewBox="-80 0 640 640" preserveAspectRatio="none">
        <use href="#u1"/>
      </svg>
    </g>
    <text y="173.18" font-size="9" fill="var(--text)">contain</text>
  </g>
  <g transform="translate(260 24)" class="a m3">
    <rect width="110" height="150" fill="var(--border)"/>
    <g clip-path="url(#c3)">
      <svg width="110" height="150" viewBox="5 0 469.33 640" preserveAspectRatio="none">
        <use href="#u1"/>
      </svg>
    </g>
    <text y="173.18" font-size="9" fill="var(--text)">arch</text>
  </g>
</svg>
