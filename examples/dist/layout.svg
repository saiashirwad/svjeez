        <text x="31.5" y="28.76" font-size="13" fill="var(--text)">Measure</text>
        <text font-family="'Geist'" font-size="12.5" fill="var(--muted)"><tspan x="15.5" y="55.223">Every node has a box</tspan><tspan x="15.5" y="72.723">the compiler knows,</tspan><tspan x="15.5" y="90.223">its text included.</tspan></text>
