<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="card-t card-d" font-family="'card-Geist'" font-weight="400" class="card-root">
  <title id="card-t">Hover card</title>
  <desc id="card-d">A trail card that lifts, casts a shadow and reveals a detail row, all on one clock. Page code rests the clock at 1 when the pointer enters the card and at 0 when it leaves, so a quick in and out reverses smoothly.</desc>
  <style><![CDATA[
svg.card-root{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg.card-root{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'card-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'card-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.card-a{animation-duration:2s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes card-k1{0%,30%{opacity:0}45%,100%{opacity:0.05}}
.card-m1{animation-name:card-k1}
@keyframes card-k2{0%,30%{opacity:0}45%,100%{opacity:0.1}}
.card-m2{animation-name:card-k2}
@keyframes card-k3{0%,37.5%{opacity:0;translate:0 8px}55%,100%{opacity:1;translate:0 0}}
.card-m3{animation-name:card-k3}
@keyframes card-k4{0%,30%{translate:0 0}45%,100%{translate:0 -8px}}
.card-m4{animation-name:card-k4}
@media (prefers-reduced-motion:reduce){.card-a{animation-delay:-1.7s!important;animation-play-state:paused!important}.card-dm{display:none}.card-ds{display:inline}}
]]></style>
  <rect width="400" height="260" fill="var(--background)"/>
  <g transform="translate(80 50)" fill="var(--text)">
    <rect x="7" y="20" width="226" height="120" rx="18" data-clock="hover" data-clock-at="0.6" data-clock-over="0.5" class="card-a card-m1"/>
    <rect x="14" y="26" width="212" height="112" rx="16" data-clock="hover" data-clock-at="0.6" data-clock-over="0.5" class="card-a card-m2"/>
    <g data-clock="hover" data-clock-at="0.6" data-clock-over="0.5" data-hit="card" class="card-a card-m4" font-size="12">
      <rect width="240" height="140" rx="16" fill="var(--surface)" stroke="var(--raised)" stroke-width="1.5" class="card-dm">
        <animate attributeName="height" values="96;96;140;140" keyTimes="0;0.375;0.55;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1;0 0 1 1" dur="2s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect width="240" height="140" rx="16" fill="var(--surface)" stroke="var(--raised)" stroke-width="1.5" class="card-ds" display="none"/>
      <circle cx="34" cy="36" r="15" fill="var(--green)"/>
      <text x="60" y="34" font-weight="600" font-size="15" fill="var(--text)">Aurora Lake Trail</text>
      <text x="60" y="54" fill="var(--muted)">4.2 km, easy</text>
      <g class="card-a card-m3">
        <rect x="20" y="82" width="200" height="1.5" fill="var(--raised)"/>
        <text x="20" y="112" fill="var(--text)">Open 6am to 9pm</text>
        <text x="172.624" y="112" fill="var(--muted)">4.8 stars</text>
      </g>
    </g>
  </g>
</svg>
