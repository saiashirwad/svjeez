<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="form-t form-d" data-states="{&quot;field.empty&quot;:{&quot;focus&quot;:0,&quot;verdict&quot;:0,&quot;ready&quot;:0},&quot;field.typing&quot;:{&quot;focus&quot;:1,&quot;verdict&quot;:0,&quot;ready&quot;:0},&quot;field.valid&quot;:{&quot;focus&quot;:1,&quot;verdict&quot;:0.5,&quot;ready&quot;:1},&quot;field.invalid&quot;:{&quot;focus&quot;:1,&quot;verdict&quot;:1,&quot;ready&quot;:0},&quot;submit.idle&quot;:{&quot;send&quot;:0},&quot;submit.sending&quot;:{&quot;send&quot;:0.5},&quot;submit.done&quot;:{&quot;send&quot;:1}}" font-family="'form-Geist'" font-weight="400" class="form-root">
  <title id="form-t">Sign-up form</title>
  <desc id="form-d">A sign-up card with two independent regions. The email field's border turns blue while typing, then green with a check mark or red with an error; the button wakes when the email is valid, spins while sending and turns into a check. XState decides the state; page code only tells the view where each clock rests.</desc>
  <style><![CDATA[
svg.form-root{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg.form-root{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'form-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'form-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.form-a{animation-duration:3.5s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes form-k1{0%,11.429%{opacity:0}20%,100%{opacity:1}}
.form-m1{animation-name:form-k1}
@keyframes form-k2{0%,25.714%,42.857%,100%{opacity:0}28.571%,37.143%{opacity:1}}
.form-m2{animation-name:form-k2}
@keyframes form-k3{0%,27.143%{stroke-dashoffset:1;visibility:hidden}37.143%,100%{stroke-dashoffset:0;visibility:visible}}
@keyframes form-k4{0%,37.143%{opacity:1}42.857%,100%{opacity:0}}
.form-m3{animation-name:form-k3,form-k4}
@keyframes form-k5{0%,37.143%{opacity:0}45.714%,100%{opacity:1}}
.form-m4{animation-name:form-k5}
@keyframes form-k6{0%,40%{opacity:0}48.571%,100%{opacity:1}}
.form-m5{animation-name:form-k6}
@keyframes form-k7{0%,51.429%{opacity:0.35}60%,100%{opacity:1}}
.form-m6{animation-name:form-k7}
@keyframes form-k8{0%,82.857%{opacity:0}91.429%,100%{opacity:1}}
.form-m7{animation-name:form-k8}
@keyframes form-k9{0%,62.857%{opacity:1}70%,100%{opacity:0}}
.form-m8{animation-name:form-k9}
@keyframes form-k10{0%,62.857%{rotate:0deg}80%,100%{rotate:540deg}}
@keyframes form-k11{0%,62.857%,85.714%,100%{opacity:0}70%,80%{opacity:1}}
.form-m9{animation-name:form-k10,form-k11;animation-timing-function:linear,cubic-bezier(.23,1,.32,1)}
@keyframes form-k12{0%,85.714%{stroke-dashoffset:1;visibility:hidden}97.143%,100%{stroke-dashoffset:0;visibility:visible}}
.form-m10{animation-name:form-k12}
@media (prefers-reduced-motion:reduce){.form-a{animation-delay:-2.975s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="400" height="300" fill="var(--background)"/>
  <text x="126.6" y="54" font-weight="600" font-size="20" fill="var(--text)">Create account</text>
  <g transform="translate(40 76)" data-hit="field" fill="none">
    <rect width="320" height="48" rx="12" fill="var(--surface)" stroke="var(--raised)" stroke-width="1.5"/>
    <rect width="320" height="48" rx="12" stroke="var(--blue)" stroke-width="2" data-clock="focus" data-clock-at="0.4" data-clock-over="0.3" class="form-a form-m1"/>
    <rect width="320" height="48" rx="12" stroke="var(--green)" stroke-width="2" data-clock="verdict" data-clock-at="0.9" data-clock-over="0.8" class="form-a form-m2"/>
    <polyline points="288 25 295 32 307 17" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-clock="verdict" data-clock-at="0.9" data-clock-over="0.8" pathLength="1" stroke-dasharray="1 2" class="form-a form-m3"/>
    <rect width="320" height="48" rx="12" stroke="var(--red)" stroke-width="2" data-clock="verdict" data-clock-at="0.9" data-clock-over="0.8" class="form-a form-m4"/>
    <text y="72" font-size="12" fill="var(--red)" data-clock="verdict" data-clock-at="0.9" data-clock-over="0.8" class="form-a form-m5">Enter an email like you@example.com</text>
  </g>
  <g transform="translate(40 176)" data-hit="submit" fill="none">
    <rect width="320" height="48" rx="12" fill="var(--blue)" data-clock="ready" data-clock-at="1.8" data-clock-over="0.3" class="form-a form-m6"/>
    <rect width="320" height="48" rx="12" fill="var(--green)" data-clock="send" data-clock-at="2.2" data-clock-over="1.2" class="form-a form-m7"/>
    <text x="132.918" y="29" font-weight="600" font-size="15" fill="var(--background)" data-clock="send" data-clock-at="2.2" data-clock-over="1.2" class="form-a form-m8">Sign up</text>
    <path d="M10 0A10 10 0 1 1 0 -10" transform="translate(160 24)" stroke="var(--background)" stroke-width="3" stroke-linecap="round" style="transform-origin:160px 24px" data-clock="send" data-clock-at="2.2" data-clock-over="1.2" class="form-a form-m9"/>
    <polyline points="146 25 155 34 172 15" stroke="var(--background)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-clock="send" data-clock-at="2.2" data-clock-over="1.2" pathLength="1" stroke-dasharray="1 2" class="form-a form-m10"/>
  </g>
</svg>
