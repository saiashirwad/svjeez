<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-labelledby="tabs-t tabs-d" data-states="{&quot;overview&quot;:{&quot;pill&quot;:0,&quot;panel&quot;:0},&quot;usage&quot;:{&quot;pill&quot;:0.5,&quot;panel&quot;:0.5},&quot;billing&quot;:{&quot;pill&quot;:1,&quot;panel&quot;:1}}" font-family="'tabs-Geist'" font-weight="400" class="tabs-root">
  <title id="tabs-t">Tabs</title>
  <desc id="tabs-d">A segmented control with three tabs on two clocks: a pill slides under the chosen tab while the panel below crossfades its text and morphs its shape and color. Page code rests both clocks at a tab's place and goes to the tab that is clicked.</desc>
  <style><![CDATA[
svg.tabs-root{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg.tabs-root{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'tabs-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'tabs-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.tabs-a{animation-duration:3s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes tabs-k1{0%,20%{translate:64px 28px}36.667%{translate:184px 28px}53.333%,100%{translate:304px 28px}}
.tabs-m1{animation-name:tabs-k1;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes tabs-k2{0%,20%{fill:var(--blue)}46.667%{fill:var(--orange)}73.333%,100%{fill:var(--magenta)}}
.tabs-m2{animation-name:tabs-k2}
@keyframes tabs-k3{0%,20%{opacity:1}28%,100%{opacity:0}}
.tabs-m3{animation-name:tabs-k3}
@keyframes tabs-k4{0%,38.667%,54.667%,100%{opacity:0}46.667%{opacity:1}}
.tabs-m4{animation-name:tabs-k4}
@keyframes tabs-k5{0%,65.333%{opacity:0}73.333%,100%{opacity:1}}
.tabs-m5{animation-name:tabs-k5}
@media (prefers-reduced-motion:reduce){.tabs-a{animation-delay:-2.55s!important;animation-play-state:paused!important}.tabs-dm{display:none}.tabs-ds{display:inline}}
]]></style>
  <rect width="480" height="280" fill="var(--background)"/>
  <path d="M12 0H120V40H12A12 12 0 0 1 0 28V12A12 12 0 0 1 12 0Z" transform="translate(60 24)" fill="var(--raised)" data-hit="tab-overview"/>
  <rect x="180" y="24" width="120" height="40" fill="var(--raised)" data-hit="tab-usage"/>
  <path d="M0 0H108A12 12 0 0 1 120 12V28A12 12 0 0 1 108 40H0V0Z" transform="translate(300 24)" fill="var(--raised)" data-hit="tab-billing"/>
  <rect width="112" height="32" rx="9" fill="var(--background)" data-clock="pill" data-clock-at="0.6" data-clock-over="1" class="tabs-a tabs-m1"/>
  <text x="88.486" y="49" font-weight="600" font-size="14" fill="var(--text)" data-hit="tab-overview">Overview</text>
  <text x="218.881" y="49" font-weight="600" font-size="14" fill="var(--text)" data-hit="tab-usage">Usage</text>
  <text x="338.944" y="49" font-weight="600" font-size="14" fill="var(--text)" data-hit="tab-billing">Billing</text>
  <rect x="60.75" y="84.75" width="360" height="170" rx="16" fill="var(--surface)" stroke="var(--raised)" stroke-width="1.5"/>
  <path d="M0 -34l8 20.14l5.86 5.86l2.14 8l13.44 17l-21.44 -3.14l-8 2.14l-8 -2.14l-21.44 3.14l13.44 -17l2.14 -8l5.86 -5.86z" transform="translate(120 169)" fill="var(--blue)" data-clock="panel" data-clock-at="0.6" data-clock-over="1.6" class="tabs-a tabs-m2 tabs-dm">
    <animate attributeName="d" values="M0-28l14 3.75l10.25 10.25l3.75 14l-3.75 14l-10.25 10.25l-14 3.75l-14-3.75l-10.25-10.25l-3.75-14l3.75-14l10.25-10.25z;M0-28l14 3.75l10.25 10.25l3.75 14l-3.75 14l-10.25 10.25l-14 3.75l-14-3.75l-10.25-10.25l-3.75-14l3.75-14l10.25-10.25z;M0-32l7.5 19.01l20.21-3.01l-12.71 16l12.71 16l-20.21-3.01l-7.5 19.01l-7.5-19.01l-20.21 3.01l12.71-16l-12.71-16l20.21 3.01z;M0-34l8 20.14l5.86 5.86l2.14 8l13.44 17l-21.44-3.14l-8 2.14l-8-2.14l-21.44 3.14l13.44-17l2.14-8l5.86-5.86z;M0-34l8 20.14l5.86 5.86l2.14 8l13.44 17l-21.44-3.14l-8 2.14l-8-2.14l-21.44 3.14l13.44-17l2.14-8l5.86-5.86z" keyTimes="0;0.2;0.46667;0.73333;1" calcMode="spline" keySplines="0 0 1 1;0.77 0 0.175 1;0.77 0 0.175 1;0 0 1 1" dur="3s" repeatCount="1" fill="freeze"/>
  </path>
  <path d="M0 -34l8 20.14l5.86 5.86l2.14 8l13.44 17l-21.44 -3.14l-8 2.14l-8 -2.14l-21.44 3.14l13.44 -17l2.14 -8l5.86 -5.86z" transform="translate(120 169)" fill="var(--blue)" data-clock="panel" data-clock-at="0.6" data-clock-over="1.6" class="tabs-a tabs-m2 tabs-ds" display="none"/>
  <g data-clock="panel" data-clock-at="0.6" data-clock-over="1.6" class="tabs-a tabs-m3">
    <text x="180" y="164" font-weight="600" font-size="17" fill="var(--text)">Everything at a glance</text>
    <text x="180" y="188" font-size="13" fill="var(--muted)">Projects, activity and health.</text>
  </g>
  <g data-clock="panel" data-clock-at="0.6" data-clock-over="1.6" class="tabs-a tabs-m4">
    <text x="180" y="164" font-weight="600" font-size="17" fill="var(--text)">Usage this month</text>
    <text x="180" y="188" font-size="13" fill="var(--muted)">Requests and storage, by day.</text>
  </g>
  <g data-clock="panel" data-clock-at="0.6" data-clock-over="1.6" class="tabs-a tabs-m5">
    <text x="180" y="164" font-weight="600" font-size="17" fill="var(--text)">Plan and invoices</text>
    <text x="180" y="188" font-size="13" fill="var(--muted)">Payment, receipts and seats.</text>
  </g>
