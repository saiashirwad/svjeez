  <title id="t">A diagram that builds itself</title>
  <desc id="d">A flowchart from prompt to finished SVG appears node by node. The svjeez chick hops along it, is puzzled at Frames ok? the first time and walks the no line back to try again, then says yes and walks on to the finished SVG.</desc>
