  <title id="t">404: not on the timeline</title>
  <desc id="d">The svjeez chick hops along a timeline behind its playhead. The track ends at 3s and the chick skids to a stop, but the playhead sails on into the dark. The chick looks around, lights its antenna bulb like a flashlight and finds the playhead parked far away at 404s.</desc>
