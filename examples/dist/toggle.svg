<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="toggle-t toggle-d" font-family="'toggle-Geist'" font-weight="400" class="toggle-root">
  <title id="toggle-t">Toggle</title>
  <desc id="toggle-d">A switch with two states on one clock: the knob slides, the track turns green and the label crossfades from Off to On. Page code rests the clock at 0 or 1 and flips it on a click, from wherever it is.</desc>
  <style><![CDATA[
svg.toggle-root{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg.toggle-root{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'toggle-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'toggle-Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.toggle-a{animation-duration:2s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes toggle-k1{0%,30%{fill:var(--raised)}50%,100%{fill:var(--green)}}
.toggle-m1{animation-name:toggle-k1}
@keyframes toggle-k2{0%,30%{translate:32px 32px}50%,100%{translate:88px 32px}}
.toggle-m2{animation-name:toggle-k2;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes toggle-k3{0%,30%{opacity:1}40%,100%{opacity:0}}
.toggle-m3{animation-name:toggle-k3}
@keyframes toggle-k4{0%,40%{opacity:0}50%,100%{opacity:1}}
.toggle-m4{animation-name:toggle-k4}
@media (prefers-reduced-motion:reduce){.toggle-a{animation-delay:-1.7s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="360" height="220" fill="var(--background)"/>
  <text x="130.936" y="52" font-weight="600" font-size="16" fill="var(--text)">Notifications</text>
  <g transform="translate(120 78)" data-hit="switch" font-size="15">
    <rect width="120" height="64" rx="32" fill="var(--raised)" data-clock="flip" data-clock-at="0.6" data-clock-over="0.4" class="toggle-a toggle-m1"/>
    <circle r="26" fill="#FFFFFF" data-clock="flip" data-clock-at="0.6" data-clock-over="0.4" class="toggle-a toggle-m2"/>
    <text x="49.028" y="104" fill="var(--muted)" data-clock="flip" data-clock-at="0.6" data-clock-over="0.4" class="toggle-a toggle-m3">Off</text>
    <text x="50.1" y="104" fill="var(--text)" data-clock="flip" data-clock-at="0.6" data-clock-over="0.4" class="toggle-a toggle-m4">On</text>
  </g>
</svg>
