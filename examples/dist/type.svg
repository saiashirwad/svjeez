]]></style>
  <rect width="480" height="300" fill="var(--surface)"/>
  <rect x="24" y="20" width="432" height="260" rx="12" fill="var(--background)"/>
  <text x="44" y="64.12" font-weight="600" font-size="24" fill="var(--text)">Type, measured</text>
  <text font-size="14" fill="var(--muted)"><tspan x="44" y="99.27">Every run is measured with its own face when the scene</tspan><tspan x="44" y="120.27">compiles, so </tspan><tspan x="126.474" font-weight="600" fill="var(--text)">semibold words</tspan><tspan x="232.244"> and </tspan><tspan x="263.198" font-style="italic">an italic aside</tspan><tspan x="349.522"> wrap with</tspan><tspan x="44" y="141.27">the text around them, a </tspan><tspan x="196.32" fill="var(--blue)">colored phrase keeps its place</tspan><tspan x="390.36">, and</tspan><tspan x="44" y="162.27">this word </tspan><tspan x="106.93" font-weight="600" fill="var(--text)" class="a m1">glows</tspan><tspan x="146.802"> without moving a letter.</tspan></text>
  <text font-family="'JetBrains Mono'" font-size="13" fill="var(--text)"><tspan x="44" y="193.66" fill="var(--magenta)">const </tspan><tspan x="90.8">total = </tspan><tspan x="153.2" fill="var(--blue)">42</tspan><tspan x="168.8">;</tspan></text>
  <text font-size="14" fill="var(--text)" fill-opacity="0" class="a m9"><tspan x="44" y="225.63">One </tspan><tspan x="73.666" fill-opacity="0" class="a m2">word </tspan><tspan x="109.226" fill-opacity="0" class="a m3">at </tspan><tspan x="125.228" fill-opacity="0" class="a m4">a </tspan><tspan x="136.442" fill-opacity="0" class="a m5">time, </tspan><tspan x="171.484" fill-opacity="0" class="a m6">on </tspan><tspan x="191" fill-opacity="0" class="a m7">one </tspan><tspan x="218.202" fill-opacity="0" class="a m8">line.</tspan></text>
</svg>
