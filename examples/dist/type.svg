<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t" font-family="'Geist'" font-weight="400" font-style="normal">
  <title id="t">Type, measured</title>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:600;font-style:normal}
@font-face{font-family:'Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
@font-face{font-family:'Geist';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:italic}
@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:6s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,20%,90%,100%{fill:var(--text)}36.667%,73.333%{fill:var(--magenta)}}
.m1{animation-name:k1;animation-duration:3s}
@keyframes k2{0%,12%,95%,100%{fill-opacity:0}17%,90%{fill-opacity:1}}
.m2{animation-name:k2}
@keyframes k3{0%,15.667%,95%,100%{fill-opacity:0}20.667%,90%{fill-opacity:1}}
.m3{animation-name:k3}
@keyframes k4{0%,19.333%,95%,100%{fill-opacity:0}24.333%,90%{fill-opacity:1}}
.m4{animation-name:k4}
@keyframes k5{0%,23%,95%,100%{fill-opacity:0}28%,90%{fill-opacity:1}}
.m5{animation-name:k5}
@keyframes k6{0%,26.667%,95%,100%{fill-opacity:0}31.667%,90%{fill-opacity:1}}
.m6{animation-name:k6}
@keyframes k7{0%,30.333%,95%,100%{fill-opacity:0}35.333%,90%{fill-opacity:1}}
.m7{animation-name:k7}
