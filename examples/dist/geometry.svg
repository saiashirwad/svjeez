<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="t d" font-family="'JetBrains Mono'">
  <title id="t">Animated geometry</title>
  <desc id="d">A rect grows and rounds its corners, an arc opens around its circle, a star morphs into a heart, a ring's stroke swells, and a trimmed window travels around a circle.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:5s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,8%,100%{translate:46px 74px}36%,84%{translate:16px 60px}}
.m1{animation-name:k1;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes k2{0%,8%,100%{stroke-dasharray:0 2;stroke-dashoffset:0}44%,84%{stroke-dasharray:1 2;stroke-dashoffset:0}}
.m2{animation-name:k2;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes k3{0%,8%,100%{stroke-width:2}36%,76%{stroke-width:18}}
.m3{animation-name:k3;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes k4{0%,6%{stroke-dasharray:0 2;stroke-dashoffset:0;visibility:hidden}22%{stroke-dasharray:0.35 2;stroke-dashoffset:0;visibility:visible;animation-timing-function:cubic-bezier(.77,0,.175,1)}58%{stroke-dasharray:0.35 2;stroke-dashoffset:-0.65;visibility:visible;animation-timing-function:cubic-bezier(.55,.06,.68,.19)}74%,100%{stroke-dasharray:0 2;stroke-dashoffset:-1;visibility:hidden}}
.m4{animation-name:k4}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-2.5s!important;animation-play-state:paused!important}.dm{display:none}.ds{display:inline}}
]]></style>
