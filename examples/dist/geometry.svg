  <rect width="96" height="64" rx="20" fill="var(--blue)" class="a m1 dm">
    <animate attributeName="width" values="36;36;96;96;36" keyTimes="0;0.08;0.36;0.84;1" calcMode="spline" keySplines="0 0 1 1;0.77 0 0.175 1;0 0 1 1;0.77 0 0.175 1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="height" values="36;36;64;64;36" keyTimes="0;0.08;0.36;0.84;1" calcMode="spline" keySplines="0 0 1 1;0.77 0 0.175 1;0 0 1 1;0.77 0 0.175 1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="4;4;20;20;4" keyTimes="0;0.08;0.36;0.84;1" calcMode="spline" keySplines="0 0 1 1;0.77 0 0.175 1;0 0 1 1;0.77 0 0.175 1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect width="96" height="64" rx="20" fill="var(--blue)" class="a m1 ds" display="none"/>
  <text x="28" y="186" font-size="12" fill="var(--muted)">rect grows</text>
