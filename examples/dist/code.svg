<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t d" font-family="'JetBrains Mono'">
  <title id="t">A function, typed out</title>
  <desc id="d">A TypeScript Fibonacci function types itself, colored by role from the scene's palette, then a bar marks its recursive line.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF;--tomorrow-keyword:#B294BB;--tomorrow-plain:#C5C8C6;--tomorrow-function:#81A2BE;--tomorrow-punctuation:#B4B7B4;--tomorrow-type:#F0C674;--tomorrow-number:#DE935F}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0;--tomorrow-keyword:#8959A8;--tomorrow-plain:#4D4D4C;--tomorrow-function:#416FAA;--tomorrow-punctuation:#6D6F6D;--tomorrow-type:#896B00;--tomorrow-number:#AB5708}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:4s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,7.5%{scale:0 1}24.185%,100%{scale:1 1}}
.m1{animation-name:k1;animation-timing-function:steps(33)}
@keyframes k2{0%,24.185%{scale:0 1}35.309%,100%{scale:1 1}}
.m2{animation-name:k2;animation-timing-function:steps(22)}
@keyframes k3{0%,35.309%{scale:0 1}51.994%,100%{scale:1 1}}
.m3{animation-name:k3;animation-timing-function:steps(33)}
@keyframes k4{0%,60%{opacity:0}70%,100%{opacity:0.3}}
.m4{animation-name:k4}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-3.4s!important;animation-play-state:paused!important}.dm{display:none}.ds{display:inline}}
]]></style>
  <defs>
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" y1="150.5" x2="480" y2="150.5">
      <stop stop-color="var(--blue)"/>
      <stop offset="1" stop-color="var(--background)"/>
    </linearGradient>
    <clipPath id="c1">
      <rect width="415.8" height="27.72" style="transform-origin:0 0" class="a m1"/>
    </clipPath>
    <clipPath id="c2">
      <rect y="31.5" width="277.2" height="27.72" style="transform-origin:0 31.5px" class="a m2"/>
    </clipPath>
    <clipPath id="c3">
      <rect y="63" width="415.8" height="27.72" style="transform-origin:0 63px" class="a m3"/>
    </clipPath>
    <clipPath id="c4">
      <rect y="94.5" width="12.6" height="27.72" class="dm">
        <animate attributeName="width" values="0;0;12.6;12.6" keyTimes="0;0.51994;0.525;1" calcMode="discrete" dur="4s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect y="94.5" width="12.6" height="27.72" class="ds" display="none"/>
    </clipPath>
  </defs>
  <rect width="480" height="270" fill="var(--background)"/>
  <rect y="133" width="480" height="35" fill="url(#g1)" class="a m4"/>
  <g transform="translate(32 72)" font-size="21" fill="var(--tomorrow-punctuation)">
    <text clip-path="url(#c1)"><tspan y="21.42" fill="var(--tomorrow-keyword)">function </tspan><tspan x="113.4" fill="var(--tomorrow-function)">fib</tspan><tspan x="151.2">(</tspan><tspan x="163.8" fill="var(--tomorrow-plain)">n</tspan><tspan x="176.4">: </tspan><tspan x="201.6" fill="var(--tomorrow-type)">number</tspan><tspan x="277.2">): </tspan><tspan x="315" fill="var(--tomorrow-type)">number </tspan><tspan x="403.2">{</tspan></text>
    <text xml:space="preserve" clip-path="url(#c2)"><tspan y="52.92" fill="var(--tomorrow-keyword)">  if </tspan><tspan x="63">(</tspan><tspan x="75.6" fill="var(--tomorrow-plain)">n </tspan><tspan x="100.8">&lt; </tspan><tspan x="126" fill="var(--tomorrow-number)">2</tspan><tspan x="138.6">) </tspan><tspan x="163.8" fill="var(--tomorrow-keyword)">return </tspan><tspan x="252" fill="var(--tomorrow-plain)">n</tspan><tspan x="264.6">;</tspan></text>
    <text xml:space="preserve" clip-path="url(#c3)"><tspan y="84.42" fill="var(--tomorrow-keyword)">  return </tspan><tspan x="113.4" fill="var(--tomorrow-function)">fib</tspan><tspan x="151.2">(</tspan><tspan x="163.8" fill="var(--tomorrow-plain)">n </tspan><tspan x="189">- </tspan><tspan x="214.2" fill="var(--tomorrow-number)">1</tspan><tspan x="226.8">) + </tspan><tspan x="277.2" fill="var(--tomorrow-function)">fib</tspan><tspan x="315">(</tspan><tspan x="327.6" fill="var(--tomorrow-plain)">n </tspan><tspan x="352.8">- </tspan><tspan x="378" fill="var(--tomorrow-number)">2</tspan><tspan x="390.6">);</tspan></text>
    <text y="115.92" clip-path="url(#c4)">}</text>
  </g>
</svg>
