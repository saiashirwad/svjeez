<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-labelledby="t d" font-family="'JetBrains Mono'">
  <title id="t">A function, typed out</title>
  <desc id="d">A TypeScript Fibonacci function types itself, colored by role from the scene's palette, then a bar marks its recursive line.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF;--tomorrow-keyword:#B294BB;--tomorrow-plain:#C5C8C6;--tomorrow-function:#81A2BE;--tomorrow-punctuation:#B4B7B4;--tomorrow-type:#F0C674;--tomorrow-number:#DE935F}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0;--tomorrow-keyword:#8959A8;--tomorrow-plain:#4D4D4C;--tomorrow-function:#416FAA;--tomorrow-punctuation:#6D6F6D;--tomorrow-type:#896B00;--tomorrow-number:#AB5708}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:4s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%,7.5%{scale:0 1}24.185%,100%{scale:1 1}}
.m1{animation-name:k1;animation-timing-function:steps(33)}
@keyframes k2{0%,24.185%{scale:0 1}35.309%,100%{scale:1 1}}
.m2{animation-name:k2;animation-timing-function:steps(22)}
@keyframes k3{0%,35.309%{scale:0 1}51.994%,100%{scale:1 1}}
.m3{animation-name:k3;animation-timing-function:steps(33)}
@keyframes k4{0%,60%{opacity:0}70%,100%{opacity:0.18}}
.m4{animation-name:k4}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-3.4s!important;animation-play-state:paused!important}.dm{display:none}.ds{display:inline}}
]]></style>
  <defs>
    <clipPath id="c1">
      <rect width="396" height="26.4" style="transform-origin:0 0" class="a m1"/>
    </clipPath>
    <clipPath id="c2">
      <rect y="32" width="264" height="26.4" style="transform-origin:0 32px" class="a m2"/>
    </clipPath>
    <clipPath id="c3">
      <rect y="64" width="396" height="26.4" style="transform-origin:0 64px" class="a m3"/>
    </clipPath>
    <clipPath id="c4">
      <rect y="96" width="12" height="26.4" class="dm">
        <animate attributeName="width" values="0;0;12;12" keyTimes="0;0.51994;0.525;1" calcMode="discrete" dur="4s" repeatCount="1" fill="freeze"/>
      </rect>
      <rect y="96" width="12" height="26.4" class="ds" display="none"/>
    </clipPath>
  </defs>
  <rect width="480" height="340" fill="var(--background)"/>
  <rect x="36" y="172" width="400" height="36" rx="6" fill="var(--blue)" class="a m4"/>
  <g transform="translate(48 112)" font-size="20" fill="var(--tomorrow-punctuation)">
    <text clip-path="url(#c1)"><tspan y="20.4" fill="var(--tomorrow-keyword)">function </tspan><tspan x="108" fill="var(--tomorrow-function)">fib</tspan><tspan x="144">(</tspan><tspan x="156" fill="var(--tomorrow-plain)">n</tspan><tspan x="168">: </tspan><tspan x="192" fill="var(--tomorrow-type)">number</tspan><tspan x="264">): </tspan><tspan x="300" fill="var(--tomorrow-type)">number </tspan><tspan x="384">{</tspan></text>
    <text xml:space="preserve" clip-path="url(#c2)"><tspan y="52.4" fill="var(--tomorrow-keyword)">  if </tspan><tspan x="60">(</tspan><tspan x="72" fill="var(--tomorrow-plain)">n </tspan><tspan x="96">&lt; </tspan><tspan x="120" fill="var(--tomorrow-number)">2</tspan><tspan x="132">) </tspan><tspan x="156" fill="var(--tomorrow-keyword)">return </tspan><tspan x="240" fill="var(--tomorrow-plain)">n</tspan><tspan x="252">;</tspan></text>
    <text xml:space="preserve" clip-path="url(#c3)"><tspan y="84.4" fill="var(--tomorrow-keyword)">  return </tspan><tspan x="108" fill="var(--tomorrow-function)">fib</tspan><tspan x="144">(</tspan><tspan x="156" fill="var(--tomorrow-plain)">n </tspan><tspan x="180">- </tspan><tspan x="204" fill="var(--tomorrow-number)">1</tspan><tspan x="216">) + </tspan><tspan x="264" fill="var(--tomorrow-function)">fib</tspan><tspan x="300">(</tspan><tspan x="312" fill="var(--tomorrow-plain)">n </tspan><tspan x="336">- </tspan><tspan x="360" fill="var(--tomorrow-number)">2</tspan><tspan x="372">);</tspan></text>
    <text y="116.4" clip-path="url(#c4)">}</text>
  </g>
</svg>
