<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" width="600" height="110" role="img" aria-labelledby="t d">
  <title id="t">Recipes</title>
  <desc id="d">Six shapes showing enter, enter from a blur, exit, draw, shake and wiggle.</desc>
  <defs>
    <filter id="f1" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="110">
      <feGaussianBlur stdDeviation="0">
        <animate attributeName="stdDeviation" values="6;6;0;0" keyTimes="0;0.1;0.26;1" calcMode="spline" keySplines="0 0 1 1;0.23 1 0.32 1;0 0 1 1" dur="5s" repeatCount="indefinite"/>
      </feGaussianBlur>
    </filter>
    <filter id="f1s" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="110">
      <feGaussianBlur stdDeviation="0"/>
    </filter>
  </defs>
  <style><![CDATA[
svg{--base00:#1E1E20;--base01:#2A2A2D;--base02:#3A3A3D;--base03:#7C7C82;--base04:#A1A1A6;--base05:#E5E5EA;--base06:#F5F5F7;--base07:#FFFFFF;--base08:#FF6961;--base09:#FF9F0A;--base0A:#FFD60A;--base0B:#32D74B;--base0C:#64D2FF;--base0D:#5EA0FF;--base0E:#C58AFF;--base0F:#AC8E68}
@media (prefers-color-scheme:light){svg{--base00:#FFFFFF;--base01:#F5F5F7;--base02:#E5E5EA;--base03:#8E8E93;--base04:#6E6E73;--base05:#1D1D1F;--base06:#1D1D1F;--base07:#000000;--base08:#E5453B;--base09:#E8751A;--base0A:#E5A50A;--base0B:#2FA84F;--base0C:#1B9AAA;--base0D:#0A6CFF;--base0E:#9B51E0;--base0F:#A66B43}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:5s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes k1{0%,10%{opacity:0}26%,100%{opacity:1}}
.m1{animation-name:k1}
@keyframes k2{0%,10%{translate:0px 20px}26%,100%{translate:0px 0px}}
.m2{animation-name:k2}
@keyframes k3{0%,60%{opacity:1}68%,100%{opacity:0}}
.m3{animation-name:k3}
@keyframes k4{0%,10%{stroke-dashoffset:1;visibility:hidden}34%,100%{stroke-dashoffset:0;visibility:visible}}
.m4{animation-name:k4}
@keyframes k5{0%,40%,50%,100%{translate:0px 0px}41.667%{translate:-5px 0px}43.333%{translate:4px 0px}45%{translate:-3px 0px}46.667%{translate:2px 0px}48.333%{translate:-1px 0px}}
.m5{animation-name:k5;animation-timing-function:linear}
@keyframes k6{0%,100%{rotate:-6.581deg}8.333%{rotate:7.351deg}16.667%{rotate:7.195deg}25%{rotate:1.551deg}33.333%{rotate:-4.721deg}41.667%{rotate:1.121deg}50%{rotate:1.015deg}58.333%{rotate:2.463deg}66.667%{rotate:5.916deg}75%{rotate:0.408deg}83.333%{rotate:-5.363deg}91.667%{rotate:2.283deg}}
.m6{animation-name:k6;animation-duration:1.667s;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-2.5s!important;animation-play-state:paused!important}[filter="url(#f1)"]{filter:url(#f1s)}}
]]></style>
  <rect width="100%" height="100%" fill="var(--base00)"/>
  <circle cx="50" cy="50" r="18" fill="var(--base0D)" class="a m1"/>
  <text x="50" y="98" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="var(--base04)" text-anchor="middle">enter</text>
  <circle cx="150" cy="50" r="18" fill="var(--base0C)" filter="url(#f1)" class="a m2"/>
  <text x="150" y="98" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="var(--base04)" text-anchor="middle">enter blur</text>
  <circle cx="250" cy="50" r="18" fill="var(--base0B)" class="a m3"/>
  <text x="250" y="98" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="var(--base04)" text-anchor="middle">exit</text>
  <path d="M328 64L350 30L372 64Z" fill="none" stroke="var(--base0A)" stroke-width="3" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" class="a m4"/>
  <text x="350" y="98" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="var(--base04)" text-anchor="middle">draw</text>
  <rect x="434" y="34" width="32" height="32" rx="6" fill="var(--base08)" class="a m5"/>
  <text x="450" y="98" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="var(--base04)" text-anchor="middle">shake</text>
  <rect x="534" y="34" width="32" height="32" rx="6" fill="var(--base0E)" class="a m6 fb"/>
  <text x="550" y="98" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="var(--base04)" text-anchor="middle">wiggle</text>
</svg>
