<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-labelledby="t d">
  <title id="t">Hello</title>
  <desc id="d">A curve draws itself, then a dot pops in above it.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

.a{animation-duration:4s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes k1{0%,5%{stroke-dashoffset:1}35%,100%{stroke-dashoffset:0}}
.m1{animation-name:k1}
@keyframes k2{0%,30%{scale:0}42.5%,100%{scale:1}}
.m2{animation-name:k2;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-3s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="200" height="120" fill="var(--background)"/>
  <path d="M20 100C60 20 140 20 180 100" fill="none" stroke="#FF5FA8" stroke-width="4" pathLength="1" stroke-dasharray="1 2" class="a m1"/>
  <circle cx="100" cy="40" r="8" fill="#3EE6D6" class="a m2 fb"/>
</svg>
