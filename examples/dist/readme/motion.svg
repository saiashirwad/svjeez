<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-labelledby="t d">
  <title id="t">Motion</title>
  <desc id="d">A square fades in, holds, then shrinks away and cuts back to full size.</desc>
  <style><![CDATA[
svg{--background:#090A0C;--surface:#18181B;--raised:#27272A;--border:#7C7C82;--muted:#A1A1A6;--text:#E5E5EA;--red:#FF6961;--orange:#FF9F0A;--yellow:#FFD60A;--green:#32D74B;--cyan:#64D2FF;--blue:#5EA0FF;--magenta:#C58AFF}
@media (prefers-color-scheme:light){svg{--background:#FFFFFF;--surface:#F5F5F7;--raised:#E5E5EA;--border:#8E8E93;--muted:#6E6E73;--text:#1D1D1F;--red:#E5453B;--orange:#E8751A;--yellow:#E5A50A;--green:#2FA84F;--cyan:#1B9AAA;--blue:#0A6CFF;--magenta:#9B51E0}}

.a{animation-duration:5s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes k1{0%,70%,78.001%,100%{scale:1}78%{scale:0.8;animation-timing-function:steps(1)}}
@keyframes k2{0%,20%,78%,100%{opacity:0}30%{opacity:1}70%{opacity:1;animation-timing-function:cubic-bezier(.55,.06,.68,.19)}}
.m1{animation-name:k1,k2;animation-timing-function:cubic-bezier(.55,.06,.68,.19),cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-2s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="200" height="120" fill="var(--background)"/>
  <rect x="76" y="36" width="48" height="48" rx="8" fill="var(--blue)" class="a m1 fb"/>
</svg>
