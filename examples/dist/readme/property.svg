<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t d">
  <title id="t">Orbit</title>
  <desc id="d">A dot orbits the center, driven by an animated angle property.</desc>
  <style><![CDATA[
.dot {
          translate: calc(100px + 60px * var(--p1) * cos(var(--p2))) calc(100px + 60px * var(--p1) * sin(var(--p2)));
        }

@property --p1{syntax:'<number>';inherits:false;initial-value:0}
@property --p2{syntax:'<angle>';inherits:true;initial-value:0deg}
.a{animation-duration:4s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1);animation-delay:var(--t0,0s)}
@keyframes k1{0%{--p2:0deg}100%{--p2:360deg}}
.m1{animation-name:k1;animation-timing-function:linear}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-1s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="100%" height="100%" fill="#1E1E20"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#3A3A3D" stroke-width="1.5"/>
  <g class="a m1">
    <circle class="dot" r="8" fill="#C58AFF" style="--p1:1"/>
  </g>
</svg>
