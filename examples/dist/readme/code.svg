@keyframes k4{0%,100%{visibility:visible}}
.m3{animation-name:k4}
@keyframes k5{0%,25%,35%,68.75%,78.75%,100%{translate:0px 0px}}
.m4{animation-name:k5}
@keyframes k6{0%,25%{translate:0px 0px}35%,100%{translate:27px 0px}}
@keyframes k7{0%,25%{opacity:1}35%,100%{opacity:0}}
.m5{animation-name:k6,k7;animation-timing-function:cubic-bezier(.77,0,.175,1),cubic-bezier(.77,0,.175,1)}
@keyframes k8{0%,25%,78.75%,100%{translate:0px 0px}35%,68.75%{translate:54px 0px}}
.m6{animation-name:k8;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes k9{0%,25%,78.75%,100%{translate:0px 0px}35%,68.75%{translate:-36px 0px}}
.m7{animation-name:k9;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes k10{0%,25%,78.75%,100%{translate:0px 0px}35%,68.75%{translate:90px 0px}}
.m8{animation-name:k10;animation-timing-function:cubic-bezier(.77,0,.175,1)}
@keyframes k11{0%,30%,73.75%,100%{opacity:0}35%,68.75%{opacity:1}}
.m9{animation-name:k11}
@keyframes k12{0%,25%,78.75%,100%{translate:-27px 0px}35%,68.75%{translate:0px 0px}}
@keyframes k13{0%,25%,78.75%,100%{opacity:0}35%,68.75%{opacity:1}}
.m10{animation-name:k12,k13;animation-timing-function:cubic-bezier(.77,0,.175,1),cubic-bezier(.77,0,.175,1)}
@keyframes k14{0%,68.75%{translate:27px 0px}78.75%,100%{translate:0px 0px}}
@keyframes k15{0%,68.75%{opacity:0}78.75%,100%{opacity:1}}
.m11{animation-name:k14,k15;animation-timing-function:cubic-bezier(.77,0,.175,1),cubic-bezier(.77,0,.175,1)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-1s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="100%" height="100%" fill="var(--base00)"/>
  <g class="a m2">
    <rect x="175" y="37" width="33" height="30" rx="6" fill="var(--base09)" fill-opacity="0.1" stroke="var(--base09)" stroke-opacity="0.4" stroke-width="1" class="a m1"/>
  </g>
  <g>
    <text x="34" y="57.25" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base03)" class="a m3">1</text>
    <text x="34" y="81.25" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base03)" class="a m3">2</text>
