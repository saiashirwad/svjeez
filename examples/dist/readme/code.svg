    <text x="160" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base04)" class="a m4">=</text>
    <text x="178" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base0D)" class="a m5">sum</text>
    <text x="205" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base04)" class="a m6">(</text>
    <text x="214" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base05)" class="a m7">xs</text>
    <text x="232" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base04)" class="a m8">);</text>
    <text x="52" y="81.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base0E)" class="a m4">return</text>
    <text x="115" y="81.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base05)" class="a m4">total</text>
    <text x="160" y="81.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base04)" class="a m4">;</text>
    <text x="196" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base04)" class="a m9">.</text>
    <text x="205" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base0D)" class="a m10">reduce</text>
    <text x="268" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base05)" class="a m9">add</text>
    <text x="295" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base04)" class="a m9">,</text>
    <text x="313" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base09)" class="a m9">0</text>
    <text x="178" y="57.25" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="15" fill="var(--base0D)" class="a m11">sum</text>
  </g>
