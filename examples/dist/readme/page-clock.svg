@keyframes k11{0%,18.75%{stroke-dashoffset:1;visibility:hidden}21.375%,100%{stroke-dashoffset:0;visibility:visible}}
.m11{animation-name:k11}
@keyframes k12{0%{visibility:hidden}20.6%,100%{visibility:visible}}
.m12{animation-name:k12;animation-timing-function:steps(1)}
@keyframes k13{0%,18.75%{translate:0 6px;opacity:0}21.875%,100%{translate:0 0;opacity:1}}
.m13{animation-name:k13}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-7.5s!important;animation-play-state:paused!important}}
]]></style>
