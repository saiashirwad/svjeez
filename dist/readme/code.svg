]]></style><rect width="100%" height="100%" fill="var(--base00)"/><g class="a m2"><rect x="175" y="37" width="33" height="30" rx="6" fill="#f6c96b" fill-opacity="0.1" stroke="#f6c96b" stroke-opacity="0.4" stroke-width="1" class="a m1"/></g><g class="mono"><g><text x="34" y="57.25" text-anchor="end" font-family="monospace" font-size="15" fill="var(--base03)" class="a m3">1</text><text x="34" y="81.25" text-anchor="end" font-family="monospace" font-size="15" fill="var(--base03)" class="a m3">2</text><text x="52" y="57.25" font-family="monospace" font-size="15" fill="var(--base0E)" class="a m4">const</text><text x="106" y="57.25" font-family="monospace" font-size="15" fill="var(--base05)" class="a m4">total</text><text x="160" y="57.25" font-family="monospace" font-size="15" fill="var(--base04)" class="a m4">=</text><text x="178" y="57.25" font-family="monospace" font-size="15" fill="var(--base0D)" class="a m5">sum</text><text x="205" y="57.25" font-family="monospace" font-size="15" fill="var(--base04)" class="a m6">(</text><text x="214" y="57.25" font-family="monospace" font-size="15" fill="var(--base05)" class="a m7">xs</text><text x="232" y="57.25" font-family="monospace" font-size="15" fill="var(--base04)" class="a m8">);</text><text x="52" y="81.25" font-family="monospace" font-size="15" fill="var(--base0E)" class="a m4">return</text><text x="115" y="81.25" font-family="monospace" font-size="15" fill="var(--base05)" class="a m4">total</text><text x="160" y="81.25" font-family="monospace" font-size="15" fill="var(--base04)" class="a m4">;</text><text x="196" y="57.25" font-family="monospace" font-size="15" fill="var(--base04)" class="a m9">.</text><text x="205" y="57.25" font-family="monospace" font-size="15" fill="var(--base0D)" class="a m01">reduce</text><text x="268" y="57.25" font-family="monospace" font-size="15" fill="var(--base05)" class="a m9">add</text><text x="295" y="57.25" font-family="monospace" font-size="15" fill="var(--base04)" class="a m9">,</text>