<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-labelledby="t d"><title id="t">Effects</title><desc id="d">A glowing word beside a hand-drawn house that boils.</desc><defs><filter id="f1" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="120"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="f2" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="120"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" seed="5"><animate attributeName="seed" values="1;2;3;4;5" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="0.4s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="f2s" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="120"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" seed="5"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter></defs><style><![CDATA[
