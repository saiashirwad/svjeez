<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-labelledby="t d"><title id="t">Motion</title><desc id="d">A square fades in, holds, then shrinks away and cuts back to full size.</desc><style><![CDATA[
svg{--base00:#1d1f21;--base01:#282a2e;--base02:#373b41;--base03:#969896;--base04:#b4b7b4;--base05:#c5c8c6;--base06:#e0e0e0;--base07:#ffffff;--base08:#cc6666;--base09:#de935f;--base0A:#f0c674;--base0B:#b5bd68;--base0C:#8abeb7;--base0D:#81a2be;--base0E:#b294bb;--base0F:#a3685a}
@media (prefers-color-scheme:light){svg{--base00:#ffffff;--base01:#e0e0e0;--base02:#d6d6d6;--base03:#8e908c;--base04:#969896;--base05:#4d4d4c;--base06:#282a2e;--base07:#1d1f21;--base08:#c82829;--base09:#f5871f;--base0A:#eab700;--base0B:#718c00;--base0C:#3e999f;--base0D:#4271ae;--base0E:#8959a8;--base0F:#a3685a}}
.mono,.mono text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-ligatures:none}

.a{animation-duration:5s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes k1{0%,20%,78%,100%{opacity:0}30%{opacity:1}70%{opacity:1;animation-timing-function:cubic-bezier(.55,.06,.68,.19)}}
@keyframes k2{0%,70%,78.001%,100%{scale:1}78%{scale:0.8;animation-timing-function:steps(1)}}
.m1{animation-name:k1,k2;animation-timing-function:cubic-bezier(.23,1,.32,1),cubic-bezier(.55,.06,.68,.19)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-2s!important;animation-play-state:paused!important}}
]]></style><rect width="100%" height="100%" fill="var(--base00)"/><rect x="76" y="36" width="48" height="48" rx="8" fill="var(--base0D)" class="a m1 fb"/></svg>
