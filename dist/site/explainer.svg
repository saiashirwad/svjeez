<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 340" width="504" height="340" role="img" aria-labelledby="t d">
  <title id="t">Code explainers</title>
  <desc id="d">Five lines of TSX type out. A spotlight moves across them and a note explains each: draw strokes the path on over two seconds, enter fades the dot in at three.</desc>
  <defs>
    <mask id="m1">
      <rect x="-10%" y="-10%" width="120%" height="120%" fill="#fff" class="a m2"/>
      <g class="a m3">
        <rect x="26" y="60" width="381" height="90.75" fill="#fff"/>
      </g>
      <g class="a m4">
        <rect x="26" y="191.25" width="309" height="64.5" fill="#fff"/>
      </g>
    </mask>
  </defs>
  <style><![CDATA[
svg{--base00:#1E1E20;--base01:#2A2A2D;--base02:#3A3A3D;--base03:#7C7C82;--base04:#A1A1A6;--base05:#E5E5EA;--base06:#F5F5F7;--base07:#FFFFFF;--base08:#FF6961;--base09:#FF9F0A;--base0A:#FFD60A;--base0B:#32D74B;--base0C:#64D2FF;--base0D:#5EA0FF;--base0E:#C58AFF;--base0F:#AC8E68}
@media (prefers-color-scheme:light){svg{--base00:#FFFFFF;--base01:#F5F5F7;--base02:#E5E5EA;--base03:#8E8E93;--base04:#6E6E73;--base05:#1D1D1F;--base06:#1D1D1F;--base07:#000000;--base08:#E5453B;--base09:#E8751A;--base0A:#E5A50A;--base0B:#2FA84F;--base0C:#1B9AAA;--base0D:#0A6CFF;--base0E:#9B51E0;--base0F:#A66B43}}
.mono,.mono text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
.sans text,.sans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif}
.round text,.round{font-family:ui-rounded,'SF Pro Rounded',-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}

.a{animation-duration:10s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1)}
@keyframes k1{0%,8%,40%,44%,76%,100%{opacity:1}11%,37%,47%,73%{opacity:0.28}}
.m2{animation-name:k1}
@keyframes k2{0%,8%,40%,100%{opacity:0}11%,37%{opacity:1}}
.m3{animation-name:k2}
@keyframes k3{0%,44%,76%,100%{opacity:0}47%,73%{opacity:1}}
.m4{animation-name:k3}
@keyframes k4{0%,1%{opacity:0}6%,100%{opacity:1}}
@keyframes k5{0%,1%{translate:0px 6px}6%,100%{translate:0px 0px}}
.m5{animation-name:k4,k5}
@keyframes k6{0%,8%,40%,100%{opacity:0}10%,38%{opacity:1}}
.m6{animation-name:k6}
@keyframes k7{0%,44%,76%,100%{opacity:0}46%,74%{opacity:1}}
.m7{animation-name:k7}
@keyframes k8{0%,95%{opacity:1}100%{opacity:0}}
.m8{animation-name:k8}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-2.3s!important;animation-play-state:paused!important}}
]]></style>
  <g class="sans">
    <rect x="0.5" y="0.5" width="503" height="339" rx="12" fill="var(--base00)" stroke="var(--base02)"/>
    <path d="M0.5 40.5h503" stroke="var(--base01)"/>
    <circle cx="20.5" cy="20.5" r="5.5" fill="var(--base08)"/>
    <circle cx="38.5" cy="20.5" r="5.5" fill="var(--base0A)"/>
    <circle cx="56.5" cy="20.5" r="5.5" fill="var(--base0B)"/>
    <text x="252" y="24.5" font-size="12" text-anchor="middle" fill="var(--base04)">wave.tsx</text>
  </g>
  <g class="a m8">
    <g mask="url(#m1)">
      <g class="mono a m5">
        <g>
          <text x="32" y="84.375" font-family="monospace" font-size="15" fill="var(--base08)">&lt;path</text>
          <text x="86" y="84.375" font-family="monospace" font-size="15" fill="var(--base05)">d</text>
          <text x="95" y="84.375" font-family="monospace" font-size="15" fill="var(--base04)">={</text>
          <text x="113" y="84.375" font-family="monospace" font-size="15" fill="var(--base05)">wave</text>
          <text x="149" y="84.375" font-family="monospace" font-size="15" fill="var(--base04)">}</text>
          <text x="50" y="110.625" font-family="monospace" font-size="15" fill="var(--base05)">stroke</text>
          <text x="104" y="110.625" font-family="monospace" font-size="15" fill="var(--base04)">=</text>
          <text x="113" y="110.625" font-family="monospace" font-size="15" fill="var(--base0B)">"#0A6CFF"</text>
          <text x="50" y="136.875" font-family="monospace" font-size="15" fill="var(--base05)">animation</text>
          <text x="131" y="136.875" font-family="monospace" font-size="15" fill="var(--base04)">={</text>
          <text x="149" y="136.875" font-family="monospace" font-size="15" fill="var(--base0D)">draw</text>
          <text x="185" y="136.875" font-family="monospace" font-size="15" fill="var(--base04)">({</text>
          <text x="212" y="136.875" font-family="monospace" font-size="15" fill="var(--base05)">at</text>
          <text x="230" y="136.875" font-family="monospace" font-size="15" fill="var(--base04)">:</text>
          <text x="248" y="136.875" font-family="monospace" font-size="15" fill="var(--base09)">1</text>
          <text x="257" y="136.875" font-family="monospace" font-size="15" fill="var(--base04)">,</text>
          <text x="275" y="136.875" font-family="monospace" font-size="15" fill="var(--base05)">over</text>
          <text x="311" y="136.875" font-family="monospace" font-size="15" fill="var(--base04)">:</text>
          <text x="329" y="136.875" font-family="monospace" font-size="15" fill="var(--base09)">2</text>
          <text x="347" y="136.875" font-family="monospace" font-size="15" fill="var(--base04)">})}</text>
          <text x="383" y="136.875" font-family="monospace" font-size="15" fill="var(--base08)">/&gt;</text>
          <text x="32" y="215.625" font-family="monospace" font-size="15" fill="var(--base08)">&lt;circle</text>
          <text x="104" y="215.625" font-family="monospace" font-size="15" fill="var(--base05)">r</text>
          <text x="113" y="215.625" font-family="monospace" font-size="15" fill="var(--base04)">={</text>
          <text x="131" y="215.625" font-family="monospace" font-size="15" fill="var(--base09)">8</text>
          <text x="140" y="215.625" font-family="monospace" font-size="15" fill="var(--base04)">}</text>
          <text x="158" y="215.625" font-family="monospace" font-size="15" fill="var(--base05)">fill</text>
          <text x="194" y="215.625" font-family="monospace" font-size="15" fill="var(--base04)">=</text>
          <text x="203" y="215.625" font-family="monospace" font-size="15" fill="var(--base0B)">"#FF9F0A"</text>
          <text x="50" y="241.875" font-family="monospace" font-size="15" fill="var(--base05)">animation</text>
          <text x="131" y="241.875" font-family="monospace" font-size="15" fill="var(--base04)">={</text>
          <text x="149" y="241.875" font-family="monospace" font-size="15" fill="var(--base0D)">enter</text>
          <text x="194" y="241.875" font-family="monospace" font-size="15" fill="var(--base04)">({</text>
          <text x="221" y="241.875" font-family="monospace" font-size="15" fill="var(--base05)">at</text>
          <text x="239" y="241.875" font-family="monospace" font-size="15" fill="var(--base04)">:</text>
          <text x="257" y="241.875" font-family="monospace" font-size="15" fill="var(--base09)">3</text>
          <text x="275" y="241.875" font-family="monospace" font-size="15" fill="var(--base04)">})}</text>
          <text x="311" y="241.875" font-family="monospace" font-size="15" fill="var(--base08)">/&gt;</text>
        </g>
      </g>
    </g>
    <g class="sans">
      <g class="a m6">
        <path d="M167 164.75L167 144.75" fill="none" stroke="var(--base0D)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
        <rect x="43.6" y="164.75" width="246.8" height="35.6" rx="6" fill="var(--base0D)" fill-opacity="0.08" stroke="var(--base0D)" stroke-opacity="0.4"/>
        <text x="53.6" y="186.75" font-size="14" fill="var(--base0D)">draw() strokes the path on.</text>
      </g>
      <g class="a m7">
        <path d="M171.5 269.75L171.5 249.75" fill="none" stroke="var(--base09)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
        <rect x="56.5" y="269.75" width="230" height="35.6" rx="6" fill="var(--base09)" fill-opacity="0.08" stroke="var(--base09)" stroke-opacity="0.4"/>
        <text x="66.5" y="291.75" font-size="14" fill="var(--base09)">enter() fades the dot in.</text>
      </g>
    </g>
  </g>
</svg>
