  <title id="t">svjeez: a day on one timeline</title>
  <desc id="d">A motion() chain beside the sky it paints. The sky turns from dawn to noon, holds, goes to dusk and night, then back to dawn, while a sun arcs over two hills. Each line of the chain lights up while its step plays.</desc>
