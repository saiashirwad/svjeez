<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 264" width="328" height="264" role="img" aria-labelledby="t d">
  <title id="t">In an email</title>
  <desc id="d">An email with a sender, a subject and an animated bar chart that grows inside the message.</desc>
  <style><![CDATA[
svg{--base00:#1E1E20;--base01:#2A2A2D;--base02:#3A3A3D;--base03:#7C7C82;--base04:#A1A1A6;--base05:#E5E5EA;--base06:#F5F5F7;--base07:#FFFFFF;--base08:#FF6961;--base09:#FF9F0A;--base0A:#FFD60A;--base0B:#32D74B;--base0C:#64D2FF;--base0D:#5EA0FF;--base0E:#C58AFF;--base0F:#AC8E68}
@media (prefers-color-scheme:light){svg{--base00:#FFFFFF;--base01:#F5F5F7;--base02:#E5E5EA;--base03:#8E8E93;--base04:#6E6E73;--base05:#1D1D1F;--base06:#1D1D1F;--base07:#000000;--base08:#E5453B;--base09:#E8751A;--base0A:#E5A50A;--base0B:#2FA84F;--base0C:#1B9AAA;--base0D:#0A6CFF;--base0E:#9B51E0;--base0F:#A66B43}}
.sans text,.sans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif}
.round text,.round{font-family:ui-rounded,'SF Pro Rounded',-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}

.a{animation-duration:6s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes k1{0%,6.667%{scale:0}18.333%,100%{scale:1}}
.m1{animation-name:k1}
@keyframes k2{0%,10.833%{scale:0}22.5%,100%{scale:1}}
.m2{animation-name:k2}
@keyframes k3{0%,15%{scale:0}26.667%,100%{scale:1}}
.m3{animation-name:k3}
@keyframes k4{0%,19.167%{scale:0}30.833%,100%{scale:1}}
.m4{animation-name:k4}
@keyframes k5{0%,23.333%{scale:0}35%,100%{scale:1}}
.m5{animation-name:k5}
@keyframes k6{0%,91.667%{opacity:1}100%{opacity:0}}
.m6{animation-name:k6}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-3s!important;animation-play-state:paused!important}}
]]></style>
  <g class="sans">
    <rect x="0.5" y="0.5" width="327" height="263" rx="12" fill="var(--base00)" stroke="var(--base02)"/>
    <path d="M0.5 36.5h327" stroke="var(--base01)"/>
