    <rect x="144" y="168" width="28" height="44" rx="6" fill="var(--base0D)" opacity="0.75" class="a m3 fb"/>
    <rect x="190" y="144" width="28" height="68" rx="6" fill="var(--base0D)" opacity="0.75" class="a m4 fb"/>
    <rect x="236" y="132" width="28" height="80" rx="6" fill="var(--base0B)" opacity="1" class="a m5 fb"/>
  </g>
  <rect x="24" y="238" width="250" height="7" rx="3.5" fill="var(--base02)"/>
