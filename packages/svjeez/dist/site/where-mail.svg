    <circle cx="54.5" cy="18.5" r="5.5" fill="var(--base0B)"/>
    <text x="164" y="22.5" font-size="12" text-anchor="middle" fill="var(--base04)">Inbox</text>
  </g>
  <circle cx="42" cy="68" r="14" fill="var(--base0E)" opacity="0.85"/>
  <rect x="66" y="58" width="80" height="8" rx="4" fill="var(--base06)"/>
  <rect x="66" y="74" width="120" height="7" rx="3.5" fill="var(--base02)"/>
  <text class="sans" x="24" y="112" font-size="15" font-weight="700" fill="var(--base06)">Your weekly report</text>
  <rect x="24" y="126" width="280" height="98" rx="9" fill="var(--base01)" stroke="var(--base02)"/>
  <g class="a m6">
    <rect x="52" y="178" width="28" height="34" rx="6" fill="var(--base0D)" opacity="0.75" class="a m1 fb"/>
