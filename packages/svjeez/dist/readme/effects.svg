<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-labelledby="t d">
  <title id="t">Effects</title>
  <desc id="d">A glowing word beside a hand-drawn house that boils.</desc>
  <defs>
    <filter id="f1" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="120">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="f2" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="120">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" seed="5">
        <animate attributeName="seed" values="1;2;3;4;5" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="0.4s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="f2s" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="120">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" seed="5"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <style><![CDATA[
svg{--base00:#1E1E20;--base01:#2A2A2D;--base02:#3A3A3D;--base03:#7C7C82;--base04:#A1A1A6;--base05:#E5E5EA;--base06:#F5F5F7;--base07:#FFFFFF;--base08:#FF6961;--base09:#FF9F0A;--base0A:#FFD60A;--base0B:#32D74B;--base0C:#64D2FF;--base0D:#5EA0FF;--base0E:#C58AFF;--base0F:#AC8E68}
@media (prefers-color-scheme:light){svg{--base00:#FFFFFF;--base01:#F5F5F7;--base02:#E5E5EA;--base03:#8E8E93;--base04:#6E6E73;--base05:#1D1D1F;--base06:#1D1D1F;--base07:#000000;--base08:#E5453B;--base09:#E8751A;--base0A:#E5A50A;--base0B:#2FA84F;--base0C:#1B9AAA;--base0D:#0A6CFF;--base0E:#9B51E0;--base0F:#A66B43}}

@font-face{font-family:'JetBrains Mono';src:url(data:font/ttf;base64,) format('truetype');font-weight:400;font-style:normal}
.a{animation-duration:4s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1)}
@keyframes k1{0%,7.5%{stroke-dashoffset:1;visibility:hidden}37.5%,100%{stroke-dashoffset:0;visibility:visible}}
.m1{animation-name:k1}
@keyframes k2{0%,30%{stroke-dashoffset:1;visibility:hidden}45%,100%{stroke-dashoffset:0;visibility:visible}}
.m2{animation-name:k2}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-2s!important;animation-play-state:paused!important}[filter="url(#f2)"]{filter:url(#f2s)}}
]]></style>
  <rect width="100%" height="100%" fill="var(--base00)"/>
  <text x="90" y="74" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="36" font-weight="700" fill="#FF4FA3" text-anchor="middle" filter="url(#f1)">OPEN</text>
  <g filter="url(#f2)" fill="none" stroke="var(--base0C)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 100V60L240 30L280 60V100Z" pathLength="1" stroke-dasharray="1" class="a m1"/>
    <path d="M230 100V80H250V100" pathLength="1" stroke-dasharray="1" class="a m2"/>
  </g>
</svg>
