    </symbol>
    <symbol id="s5" style="overflow:visible">
      <use href="#s2" transform="matrix(4.3841 -2.192 0 5.3694 -0.2828 -4.019)"/>
      <use href="#s3" transform="matrix(4.3841 2.192 0 5.3694 -17.2534 -12.7872)"/>
      <use href="#s6" transform="matrix(4.3841 2.192 -4.3841 2.192 0 -21.0675)"/>
