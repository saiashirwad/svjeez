.mono,.mono text{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-ligatures:none}

.a{animation-duration:10s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1)}
@keyframes k1{0%,90%,100%{visibility:hidden}30%{visibility:visible}}
.m1{animation-name:k1;animation-timing-function:steps(1)}
@keyframes k2{0%,10%{translate:0px -30px}16%,100%{translate:0px 0px}}
@keyframes k3{0%{visibility:hidden}10%,100%{visibility:visible}}
.m2{animation-name:k2,k3;animation-timing-function:cubic-bezier(.34,1.56,.64,1),steps(1)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-5s!important;animation-play-state:paused!important}}
]]></style>
