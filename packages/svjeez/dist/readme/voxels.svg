<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-labelledby="t d">
  <title id="t">Voxels</title>
  <desc id="d">A grass block, a dirt block that pops in at three seconds and leaves at nine, and a dirt block that drops onto the grass.</desc>
