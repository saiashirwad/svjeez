<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-labelledby="t d">
  <title id="t">Hello</title>
  <desc id="d">A curve draws itself, then a dot pops in above it.</desc>
  <style><![CDATA[
svg{--base00:#1E1E20;--base01:#2A2A2D;--base02:#3A3A3D;--base03:#7C7C82;--base04:#A1A1A6;--base05:#E5E5EA;--base06:#F5F5F7;--base07:#FFFFFF;--base08:#FF6961;--base09:#FF9F0A;--base0A:#FFD60A;--base0B:#32D74B;--base0C:#64D2FF;--base0D:#5EA0FF;--base0E:#C58AFF;--base0F:#AC8E68}
@media (prefers-color-scheme:light){svg{--base00:#FFFFFF;--base01:#F5F5F7;--base02:#E5E5EA;--base03:#8E8E93;--base04:#6E6E73;--base05:#1D1D1F;--base06:#1D1D1F;--base07:#000000;--base08:#E5453B;--base09:#E8751A;--base0A:#E5A50A;--base0B:#2FA84F;--base0C:#1B9AAA;--base0D:#0A6CFF;--base0E:#9B51E0;--base0F:#A66B43}}

.a{animation-duration:4s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.23,1,.32,1)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes k1{0%,5%{stroke-dashoffset:1;visibility:hidden}35%,100%{stroke-dashoffset:0;visibility:visible}}
.m1{animation-name:k1}
@keyframes k2{0%,30%{scale:0}42.5%,100%{scale:1}}
.m2{animation-name:k2;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion:reduce){.a{animation-delay:-3s!important;animation-play-state:paused!important}}
]]></style>
  <rect width="100%" height="100%" fill="var(--base00)"/>
  <path d="M20 100C60 20 140 20 180 100" fill="none" stroke="#FF5FA8" stroke-width="4" pathLength="1" stroke-dasharray="1" class="a m1"/>
  <circle cx="100" cy="40" r="8" fill="#3EE6D6" class="a m2 fb"/>
</svg>
